# ==============================================================================
# @module  attachment-name-test.yml
# @about   Проверка короткого имени GitHub Video Attachment.
# @purpose Загружает тестовый WebM из папки attachment_name_test с заданным именем.
# ==============================================================================

name: GitHub Attachment Name Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attachment-name-test
  cancel-in-progress: false

jobs:
  upload_test_video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Upload Test Attachment
        env:
          MY_ADMIN_TOKEN: ${{ secrets.MY_ADMIN_TOKEN }}
        run: python _actions/attachment_name_test/test_attachment_name.py
