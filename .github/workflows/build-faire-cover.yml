# ==============================================================================
# @module  build-faire-cover.yml
# @about   Ручная сборка обложки Hackaday.io из видео и фотографий Faire.
# @purpose Создаёт JPEG-артефакт 1920x400 px, не публикуя сайт и не меняя исходники.
# @author  TechLab
# @version 1.0.0
# ==============================================================================

name: Build Faire Profile Cover

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-faire-cover.yml"
      - ".github/workflows/scripts/build-faire-cover.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: faire-profile-cover
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check Pillow

      - name: Build cover
        run: python .github/workflows/scripts/build-faire-cover.py

      - name: Save cover to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/faire-cover-1920x400.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Build Hackaday Faire profile cover"
            git push
          else
            echo "Обложка не изменилась"
          fi

      - name: Upload cover artifact
        uses: actions/upload-artifact@v4
        with:
          name: hackaday-faire-cover
          path: output/faire-cover-1920x400.jpg
          if-no-files-found: error
          retention-days: 7
