# ==============================================================================
# @module  build-hackaday-cover-test.yml
# @about   Ручная тестовая сборка обложки Hackaday.io 1920x696.
# @purpose Создаёт отдельный тестовый JPEG, не затрагивая действующую обложку.
# @author  TechLab
# @version 1.0.0
# ==============================================================================

name: Build Hackaday Cover Test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-hackaday-cover-test.yml"
      - ".github/workflows/scripts/build-hackaday-cover-test.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hackaday-cover-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build test cover
        run: python .github/workflows/scripts/build-hackaday-cover-test.py

      - name: Save test cover to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add faire/hackaday-cover-1920x696-test.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add Hackaday cover aspect-ratio test"
            git push
          else
            echo "Тестовая обложка не изменилась"
          fi

      - name: Upload test cover artifact
        uses: actions/upload-artifact@v4
        with:
          name: hackaday-cover-1920x696-test
          path: faire/hackaday-cover-1920x696-test.jpg
          if-no-files-found: error
          retention-days: 7
