# ==============================================================================
# @module  comment-builder.yml
# @about   Модуль публикации комментариев.
# @purpose Запускает публикацию комментариев по сигналу из репозитория techlab-comment-builder.
# @author  TechLab
# @version 1.0.0
# ==============================================================================

name: TechLab Comment Builder Receiver

on:
  repository_dispatch:
    types: [comment-notify]

permissions:
  contents: write

concurrency:
  group: comment-builder-receiver
  cancel-in-progress: false

jobs:
  process_comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Comment Builder Dispatcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_ADMIN_TOKEN: ${{ secrets.MY_ADMIN_TOKEN }}
        run: python _actions/comment_builder/comment_builder.py
