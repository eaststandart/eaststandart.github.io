# ==============================================================================
# @module  comment-builder.yml
# @about   Запуск конвейера Конструктора комментариев.
# @purpose Получение комплекта, пробная или реальная публикация и очистка _output.
# @author  TechLab
# @version 1.6.0
# ==============================================================================

name: TechLab Comment Builder Receiver

on:
  repository_dispatch:
    types: [comment-notify]
  push:
    paths:
      - '_actions/comment_builder/.test-trigger'

permissions:
  contents: write

concurrency:
  group: comment-builder-receiver
  cancel-in-progress: false

jobs:
  process_comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Site Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Comment Builder Dispatcher (Integration Test)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_ADMIN_TOKEN: ${{ secrets.MY_ADMIN_TOKEN }}
        run: python _actions/comment_builder/comment_builder.py --publish
