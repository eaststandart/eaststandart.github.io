name: Deploy Jekyll site with Preprocessing

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run Markdown Preprocessor
        run: python bin/preprocess.py

      - name: Upload Sitemap Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-metadata
          path: _data/sitemap.yml

      - name: Upload Sitemap Logs
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-logs
          path: _sitemap_files/*.log

      - name: Upload Universal Feed Generator Log
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-feed-log
          path: _feed_files/

      - name: Upload All Generated JSON Portions as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-feed-json
          path: assets/feed/
          if-no-files-found: error

      - name: Upload Post Page Generator Log
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-postpage-log
          path: _post_page_files/posts-page-generator.log

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
