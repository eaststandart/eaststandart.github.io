name: Broadcast Personal Lessons Report to Telegram

on:
  discussion_comment:
    types: [created]

jobs:
  telegram-personal-lessons:
    runs-on: ubuntu-latest
    steps:
      - name: Filter Discussion and Verify
        id: parse_data
        run: |
          # ⚡ ВЕРНУЛИ ВАШ ЖЕЛЕЗНЫЙ МЕТОД ИЗ СТАРОГО КОДА:
          CLEAN_NUM=$(echo "${{ github.event.discussion.number }}" | tr -cd '0-9')
          
          if [ "$CLEAN_NUM" != "38" ]; then
            echo "PROCEED=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "PROCEED=true" >> $GITHUB_ENV

      - name: Convert Markdown Table to Clean Personal Text via Python
        if: env.PROCEED == 'true'
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_EASTEMITTING_PERSONAL_ID_38 }}
          RAW_BODY: ${{ github.event.comment.body }}
        run: |
          import urllib.request
          import json
          import os
          import sys

          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          raw_body = os.environ.get("RAW_BODY", "")

          print("=== ЛОГ PYTHON: СЫРОЙ ВХОДНОЙ ТЕКСТ ИЗ OBSIDIAN ===")
          print(repr(raw_body))
          print("=====================================================")

          clean_lines = []
          
          for line in raw_body.split("\n"):
              line_str = line.strip()
              
              if "| :---" in line_str or "Группа / Ученик" in line_str:
                  continue
                  
              if line_str.startswith("|"):
                  parts = [p.strip() for p in line_str.split("|") if p.strip()]
                  
                  if len(parts) >= 1:
                      # ⚡ ИСПРАВЛЕНО: Берем первый элемент из текстового массива ячеек
                      left_cell = parts[0].replace("**", "")
                      
                      if "ГРУППА" in left_cell or "⏰" in left_cell:
                          clean_lines.append(f"\n{left_cell}")
                          
                      elif len(parts) >= 2:
                          status_cell = parts[1]
                          emoji = "🟢" if "🟢" in status_cell else "🔴" if "🔴" in status_cell else ""
                          student_name = left_cell
                          clean_lines.append(f"{student_name} {emoji}")
                          
              elif "📅" in line_str or "Преподаватель:" in line_str or "Проверил" in line_str:
                  if "Журнал посещений за" in line_str:
                      date_part = line_str.split("за")[-1].replace("г.", "").replace("###", "").strip()
                      clean_lines.append(f"📅 Отчет за {date_part}")
                  elif "Преподаватель:" in line_str or "Проверил" in line_str:
                      raw_name = line_str.split(":")[-1].replace("*", "").strip()
                      clean_lines.append(f"\nПреподаватель: <b>{raw_name}</b>")
                  else:
                      clean_lines.append(line_str)

          message_text = "\n".join([l for l in clean_lines if l.strip()]).strip()

          print("=== ЛОГ PYTHON: СФОРМИРОВАННЫЙ ТЕКСТ ДЛЯ ВАЛЕРИЯ ===")
          print(repr(message_text))
          print("=====================================================")

          # АВТОСПАСЕНИЕ КРАСНОЙ СБОРКИ: Если это не таблица отчета — выходим зелеными
          if not message_text:
              print("ℹ️ Системное уведомление: Этот комментарий не является таблицей отчёта. Пропускаем отправку.")
              sys.exit(0)

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          
          payload = {
              "chat_id": chat_id,
              "text": message_text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }

          if len(chat_id) > 10 and chat_id.startswith("822"):
              payload["message_thread_id"] = 38

          req = urllib.request.Request(
              url, 
              data=json.dumps(payload, ensure_ascii=False).encode('utf-8'), 
              headers={'Content-Type': 'application/json'}
          )
          
          print("=== ЛОГ PYTHON: ОТВЕТ СЕРВЕРА TELEGRAM API ===")
          try:
              with urllib.request.urlopen(req) as response:
                  print("HTTP Status Code:", response.getcode())
                  print("Response:", response.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
              print("HTTP Error Code:", e.code)
              print("Response Body:", e.read().decode('utf-8'))
              sys.exit(1)
          except Exception as e:
              print("Ошибка отправки сети:", str(e))
              sys.exit(1)
          print("==============================================")
