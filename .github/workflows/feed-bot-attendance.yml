name: Broadcast Personal Lessons Report to Telegram

on:
  discussion_comment:
    types: [created]

jobs:
  telegram-personal-lessons:
    runs-on: ubuntu-latest
    steps:
      - name: Filter and Clean Table Data to Clean Text
        id: parse_data
        run: |
          # 1. Проверяем, что ветка строго №38
          CURRENT_DISCUSSION="${{ github.event.discussion.number }}"
          CLEAN_NUM=$(echo "$CURRENT_DISCUSSION" | tr -cd '0-9')
          
          if [ "$CLEAN_NUM" != "38" ]; then
            echo "PROCEED=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "PROCEED=true" >> $GITHUB_ENV

          # 2. Забираем живой сырой текст из Obsidian
          RAW_BODY=$(cat << 'EOF'
          ${{ github.event.comment.body }}
          EOF
          )

          # 3. БРОНЕБОЙНАЯ ОЧИСТКА МАРКДАУН-ТАБЛИЦЫ СРЕДСТВАМИ BASH
          # Убираем шапку таблицы и разделительные дефисы
          CLEAN_TEXT=$(echo "$RAW_BODY" | grep -v -E "Группа / Ученик|\| :---")
          
          # Превращаем технический заголовок в красивый "📅 Отчет за..."
          CLEAN_TEXT=$(echo "$CLEAN_TEXT" | sed -E 's/### 📅 Журнал посещений за/📅 Отчет за/g' | sed 's/г\.//g')

          # Вырезаем палочки, слова "Присутствовал/Отсутствовал" и маркдаун-звёздочки у групп
          CLEAN_TEXT=$(echo "$CLEAN_TEXT" | sed -E 's/\|//g' | sed -E 's/Присутствовал//g' | sed -E 's/Отсутствовал//g' | sed 's/\*\*//g')

          # Переформатируем подпись преподавателя строго под правила Markdown плагина
          CLEAN_TEXT=$(echo "$CLEAN_TEXT" | sed -E 's/\*?Проверил и отправил преподаватель:\*?/\nПреподаватель:/g')
          CLEAN_TEXT=$(echo "$CLEAN_TEXT" | sed -E 's/Преподаватель:[[:space:]]*\*?([A-Za-z0-9_-]+)\*?/Преподаватель: \*\1\*/g')

          # Удаляем лишние пробелы в концах строк, сохраняя структуру
          CLEAN_TEXT=$(echo "$CLEAN_TEXT" | sed -E 's/[[:space:]]+$//')

          # Экспортируем готовый очищенный текст в плагин через буфер Гитхаба
          echo "REPORT_TEXT<<EOF" >> $GITHUB_ENV
          echo "$CLEAN_TEXT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send Standardized Personal Report to Telegram
        if: env.PROCEED == 'true'
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_EASTEMITTING_PERSONAL_ID_38 }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          # ⚡ ПЕРЕДАЕМ ЖИВОЙ, ОЧИЩЕННЫЙ ТЕКСТ КОММЕНТАРИЯ
          message: ${{ env.REPORT_TEXT }}
