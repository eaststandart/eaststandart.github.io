name: Broadcast Personal Lessons Report via Chain Trigger

on:
  # Робот просыпается строго по факту окончания работы первого бота
  workflow_run:
    workflows: ["Generate Attendance Report to Discussions"]
    types: [completed]

# Железная защита от гонки параллельных процессов на серверах Гитхаба
concurrency:
  group: personal-delivery-group
  cancel-in-progress: false

jobs:
  delivery-to-personal:
    # Запускаемся строго при успешном (зелёном) финише первого робота
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Latest Comment and Send to Telegram via Python
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_EASTSTANDART_PERSONAL_ID_38 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          import urllib.request
          import json
          import os
          import sys
          import hashlib

          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          gh_token = os.environ.get("GH_TOKEN", "").strip()
          repo_full = os.environ.get("REPO_NAME", "").strip()
          
          owner, repo_name = repo_full.split("/")
          headers_gh = {
              "Authorization": f"Bearer {gh_token}",
              "Content-Type": "application/json",
              "Accept": "application/vnd.github+json",
              "User-Agent": "GitHub-Actions-Robot"
          }
          # 🎯 ШАГ 1: Запрашиваем состояние последнего комментария в ветке через GraphQL
          # GraphQL АДРЕС: api . github . com / graphql
          url_gh = "https://api.github.com/graphql"
          
          graphql_query = {
              "query": f"""
              query {{
                repository(owner: "{owner}", name: "{repo_name}") {{
                  discussion(number: 38) {{
                    comments(last: 1) {{
                      nodes {{
                        body
                      }}
                    }}
                  }}
                }}
              }}
              """
          }

          req_gh = urllib.request.Request(url_gh, data=json.dumps(graphql_query).encode('utf-8'), headers=headers_gh)
          
          try:
              with urllib.request.urlopen(req_gh) as response:
                  res_data = json.loads(response.read().decode('utf-8'))
                  nodes = res_data['data']['repository']['discussion']['comments']['nodes']
                  if not nodes:
                      print("ℹ️ ЛОГ GITHUB: Комментарии не найдены.")
                      sys.exit(0)
                  
                  # ⚡️ ЖЕЛЕЗНОЕ ИСПРАВЛЕНИЕ: Извлекаем первый (нулевой) элемент из списка nodes
                  raw_body = nodes[0]['body']
          except Exception as e:
              print("❌ Ошибка забора данных из GraphQL API:", str(e))
              sys.exit(1)

          # 🎯 ШАГ 2: Построчно очищаем маркдаун-таблицу строго под ВАРИАНТ №3 (Шарик + Имя)
          clean_lines = []
          for line in raw_body.split("\n"):
              line_str = line.strip()
              if "| :---" in line_str or "Группа / Ученик" in line_str:
                  continue
              if line_str.startswith("|"):
                  parts = [p.strip() for p in line_str.split("|") if p.strip()]
                  if len(parts) >= 1:
                      left_cell = parts[0].replace("**", "")
                      if "ГРУППА" in left_cell or "⏰" in left_cell:
                          clean_lines.append(f"\n<b>{left_cell}</b>")
                      elif len(parts) >= 2:
                          status_cell = parts[1]
                          emoji = "🟢" if "🟢" in status_cell else "🔴" if "🔴" in status_cell else "⚪"
                          
                          # ⚡️ ВАШ ФОРМАТ: Сначала сочный шарик, потом имя ребенка
                          clean_lines.append(f"{emoji} {left_cell}")
              elif "📅" in line_str or "Преподаватель:" in line_str or "Проверил" in line_str:
                  if "Журнал посещений за" in line_str:
                      date_part = line_str.split("за")[-1].replace("г.", "").replace("###", "").strip()
                      clean_lines.append(f"📅 <b>Отчет за {date_part}</b>")
                  elif "Преподаватель:" in line_str or "Проверил" in line_str:
                      raw_name = line_str.split(":")[-1].replace("*", "").strip()
                      clean_lines.append(f"\nПреподаватель: <b>{raw_name}</b>")
                  else:
                      clean_lines.append(line_str)

          message_text = "\n".join([l for l in clean_lines if l.strip()]).strip()

          if not message_text:
              print("ℹ️ Сформированный текст отчета пуст. Завершаем.")
              sys.exit(0)

          # Считаем уникальный хэш-код текущего текста отчета для фильтрации дубликатов
          text_hash = hashlib.md5(message_text.encode('utf-8')).hexdigest()
          target_artifact_name = f"journal-hash-{text_hash}"

          # 🎯 ШАГ 3: Проверяем память серверов Гитхаба на наличие этого хэша текста
          # АДРЕС ВСЕХ АРТЕФАКТОВ: api . github . com / repos / {repo_full} / actions / artifacts
          url_arts = f"https://api.github.com/repos/{repo_full}/actions/artifacts?per_page=20"
          req_arts = urllib.request.Request(url_arts, headers=headers_gh)
          
          is_duplicate = False
          try:
              with urllib.request.urlopen(req_arts) as res_a:
                  arts_data = json.loads(res_a.read().decode('utf-8'))
                  for art in arts_data.get("artifacts", []):
                      if art.get("name") == target_artifact_name:
                          is_duplicate = True
                          break
          except Exception as e:
              print(f"• Память Гитхаба пуста: {str(e)}")

          if is_duplicate:
              print(f"🛑 ВЕРДИКТ: Этот текст отчёта уже отправлялся сегодня. Отмена дубликата!")
              sys.exit(0)

          # 🎯 ШАГ 4: Отправка в Telegram Валерию лично
          url_tg = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = {
              "chat_id": chat_id,
              "text": message_text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }
          if len(chat_id) > 10 and chat_id.startswith("822"):
              payload["message_thread_id"] = 38

          req_tg = urllib.request.Request(url_tg, data=json.dumps(payload, ensure_ascii=False).encode('utf-8'), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req_tg) as response:
                  print("🚀 ОТВЕТ TELEGRAM API: HTTP Status Code: 200 OK. Отчёт успешно доставлен!")
          except Exception as e:
              print("❌ Ошибка сети при отправке в Telegram:", str(e))
              sys.exit(1)

          # 🎯 ШАГ 5: Запоминаем уникальный хэш в папке _data/
          os.makedirs("_data", exist_ok=True)
          marker_filename = os.path.join("_data", f"{target_artifact_name}.txt")
          with open(marker_filename, "w") as f:
              f.write(text_hash)

          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f"TARGET_ARTIFACT_NAME={target_artifact_name}\n")

      # СИСТЕМНЫЙ КУБИК ГИТХАБА (сохраняет уникальный файл в память и сразу зачищает за собой диск):
      - name: Save Unique Report Hash to Memory
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET_ARTIFACT_NAME }}
          path: _data/${{ env.TARGET_ARTIFACT_NAME }}.txt
          retention-days: 1

      - name: Purge Temporary Local Hash File
        run: |
          rm -f _data/journal-hash-*.txt
