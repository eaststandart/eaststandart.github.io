name: Broadcast Personal Lessons Report via Chain Trigger

on:
  workflow_run:
    workflows: ["Generate Attendance Report to Discussions"]
    types: [completed]

jobs:
  research-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Deep Analysis of Step Execution Logs via Python
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          import urllib.request
          import json
          import os
          import sys

          gh_token = os.environ.get("GH_TOKEN", "").strip()
          repo_full = os.environ.get("REPO_NAME", "").strip()
          run_id = os.environ.get("RUN_ID", "").strip()
          run_num = os.environ.get("RUN_NUMBER", "").strip()

          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "GitHub-Actions-Robot"
          }

          # 🎯 ЗАПРОС №1: Получаем детальный статус и поминутное время всех внутренних шагов
          url_jobs = f"https://api.github.com/repos/{repo_full}/actions/runs/{run_id}/jobs"
          req_jobs = urllib.request.Request(url_jobs, headers=headers)

          print("=====================================================")
          print(f"⚡️ АНАЛИЗ ПРОГОНА РОБОТА-ГЕНЕРАТОРА №{run_num} (RUN ID: {run_id})")
          print("=====================================================")

          try:
              with urllib.request.urlopen(req_jobs) as response:
                  jobs_data = json.loads(response.read().decode('utf-8'))
                  for job in jobs_data.get("jobs", []):
                      print(f"Статус задачи '{job.get('name')}': {job.get('conclusion')}")
                      print("-----------------------------------------------------")
                      print("⏱️ Поминутный лог выполнения шагов:")
                      for step in job.get("steps", []):
                          print(f" • Шаг: [{step.get('name')}] | Статус: {step.get('conclusion')} | Начало: {step.get('started_at')} | Конец: {step.get('completed_at')}")
          except Exception as e:
              print("❌ Ошибка получения шагов выполнения:", str(e))

          print("\n=====================================================")
          print("📋 ЖИВОЙ ЛОГ ТЕКСТА ПУБЛИКАЦИИ ИЗ ДИСКУССИИ №38")
          print("=====================================================")
          
          # 🎯 ЗАПРОС №2: Запрашиваем состояние последнего комментария через GraphQL
          owner, repo_name = repo_full.split("/")
          url_gh = "https://api.github.com/graphql"
          
          graphql_query = {
              "query": f"""
              query {{
                repository(owner: "{owner}", name: "{repo_name}") {{
                  discussion(number: 38) {{
                    comments(last: 1) {{
                      nodes {{
                        id
                        author {{ login }}
                        createdAt
                        body
                      }}
                    }}
                  }}
                }}
              }}
              """
          }

          req_gh = urllib.request.Request(url_gh, data=json.dumps(graphql_query).encode('utf-8'), headers={"Authorization": f"Bearer {gh_token}", "Content-Type": "application/json", "User-Agent": "GitHub-Actions-Robot"})
          
          try:
              with urllib.request.urlopen(req_gh) as response:
                  res_data = json.loads(response.read().decode('utf-8'))
                  nodes = res_data['data']['repository']['discussion']['comments']['nodes']
                  if nodes:
                      last_comment = nodes[0]
                      print(f"• ID комментария в ветке: {last_comment.get('id')}")
                      print(f"• Кто опубликовал (Логин): {last_comment.get('author', {}).get('login')}")
                      print(f"• Время изменения ветки (UTC): {last_comment.get('createdAt')}")
                      print("\n• ТЕКСТ КОММЕНТАРИЯ НА ЭТОТ МИГ:")
                      print(last_comment.get('body', '').strip()[:200] + "\n... [текст сокращен для читаемости лога] ...")
                  else:
                      print("ℹ️ Комментарии в Дискуссии №38 отсутствуют.")
          except Exception as e:
              print("❌ Ошибка GraphQL при заборе текста ветки:", str(e))

          print("=====================================================")
          print("ℹ️ Сбор системных следов успешно завершен без ошибок коммитов.")
          print("=====================================================")
