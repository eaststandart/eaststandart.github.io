name: Broadcast Personal Lessons Report via Chain Trigger

on:
  workflow_run:
    workflows: ["Generate Attendance Report to Discussions"]
    types: [completed]

jobs:
  delivery-to-personal:
    runs-on: ubuntu-latest
    steps:
      - name: Research and Log Workflow Trigger Data via Python
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_EASTEMITTING_PERSONAL_ID_38 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          
          # Забираем из системы Гитхаба скрытые технические данные этого запуска
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          import os
          import sys

          print("=====================================================")
          print("⚡️ СИСТЕМНЫЙ ЛОГ ИССЛЕДОВАНИЯ ПРИЧИНЫ ДВОЙНОГО ЗАПУСКА")
          print("=====================================================")
          
          # Выводим на экран все скрытые метки Гитхаба, которые вызвали этот запуск
          print(f"1. Статус завершения 1-го робота (Conclusion): {os.environ.get('RUN_CONCLUSION')}")
          print(f"2. Какое событие вызвало 1-го робота (Event): {os.environ.get('RUN_EVENT')}")
          print(f"3. Уникальный ID запуска 1-го робота (Run ID): {os.environ.get('RUN_ID')}")
          print(f"4. Порядковый номер запуска (Run Number): {os.environ.get('RUN_NUMBER')}")
          print(f"5. Хеш-код коммита (SHA): {os.environ.get('RUN_SHA')}")
          print(f"6. Текст сообщения коммита: {os.environ.get('RUN_COMMIT_MSG')}")
          
          print("=====================================================")
          print("ℹ️ Анализ завершен. Этот запуск выполнен только для сбора логов.")
          print("=====================================================")
