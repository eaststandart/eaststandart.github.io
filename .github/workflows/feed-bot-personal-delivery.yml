name: Broadcast Personal Lessons Report via Chain Trigger

on:
  # Просыпаемся каждый раз, когда первый робот завершает очередной запуск
  workflow_run:
    workflows: ["Generate Attendance Report to Discussions"]
    types: [completed]

jobs:
  delivery-to-personal:
    # Запускаемся строго при успешном финише первого робота
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Latest Comment and Send to Telegram via Python
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_EASTEMITTING_PERSONAL_ID_38 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          # ИСПРАВЛЕНО: Передаем текст сообщения последнего коммита для проверки финала дня
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          import urllib.request
          import json
          import os
          import sys

          # ИСПРАВЛЕНО: Проверяем, является ли коммит финальной склейкой робота
          commit_msg = os.environ.get("COMMIT_MESSAGE", "").strip()
          print(f"--- ЛОГ ПРОВЕРКИ: Сообщение последнего коммита: '{commit_msg}' ---")
          
          # Если это не финальный авто-коммит склейки журнала, выходим без отправки в чат
          if "Сводный журнал за день" not in commit_msg:
              print("ℹ️ Это промежуточная отправка группы. Ожидаем полную склейку дня. Пропускаем.")
              sys.exit(0)

          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          gh_token = os.environ.get("GH_TOKEN", "").strip()
          repo_full = os.environ.get("REPO_NAME", "").strip()
          
          owner, repo_name = repo_full.split("/")

          # ⚡️ АДРЕС СЛУЖЕБНОГО ГРАФКВЛ API GITHUB
          url_gh = "https://api.github.com/graphql"
          
          graphql_query = {
              "query": f"""
              query {{
                repository(owner: "{owner}", name: "{repo_name}") {{
                  discussion(number: 38) {{
                    comments(last: 1) {{
                      nodes {{
                        body
                      }}
                    }}
                  }}
                }}
              }}
              """
          }

          headers_gh = {
              "Authorization": f"Bearer {gh_token}",
              "Content-Type": "application/json",
              "User-Agent": "GitHub-Actions-Robot"
          }

          req_gh = urllib.request.Request(url_gh, data=json.dumps(graphql_query).encode('utf-8'), headers=headers_gh)
          
          try:
              with urllib.request.urlopen(req_gh) as response:
                  res_data = json.loads(response.read().decode('utf-8'))
                  nodes = res_data['data']['repository']['discussion']['comments']['nodes']
                  if not nodes:
                      print("ℹ️ Комментарии в Дискуссии №38 не найдены.")
                      sys.exit(0)
                  raw_body = nodes[0]['body']
          except Exception as e:
              print("❌ Ошибка получения данных с GitHub API:", str(e))
              sys.exit(1)

          clean_lines = []
          for line in raw_body.split("\n"):
              line_str = line.strip()
              
              if "| :---" in line_str or "Группа / Ученик" in line_str:
                  continue
                  
              if line_str.startswith("|"):
                  parts = [p.strip() for p in line_str.split("|") if p.strip()]
                  
                  if len(parts) >= 1:
                      left_cell = parts[0].replace("**", "")
                      
                      if "ГРУППА" in left_cell or "⏰" in left_cell:
                          clean_lines.append(f"\n{left_cell}")
                          
                      elif len(parts) >= 2:
                          status_cell = parts[1]
                          emoji = "🟢" if "🟢" in status_cell else "🔴" if "🔴" in status_cell else ""
                          student_name = left_cell
                          clean_lines.append(f"{student_name} {emoji}")
                          
              elif "📅" in line_str or "Prepodavatel:" in line_str or "Преподаватель:" in line_str or "Проверил" in line_str:
                  if "Журнал посещений за" in line_str:
                      date_part = line_str.split("за")[-1].replace("г.", "").replace("###", "").strip()
                      clean_lines.append(f"📅 Отчет за {date_part}")
                  elif "Преподаватель:" in line_str or "Проверил" in line_str:
                      raw_name = line_str.split(":")[-1].replace("*", "").strip()
                      clean_lines.append(f"\nПреподаватель: <b>{raw_name}</b>")
                  else:
                      clean_lines.append(line_str)

          message_text = "\n".join([l for l in clean_lines if l.strip()]).strip()

          if not message_text:
              print("ℹ️ Уведомление: Текст отчета пуст. Пропускаем.")
              sys.exit(0)

          # ⚡️ СЛУЖЕБНЫЙ АДРЕС TELEGRAM API С bot И ПРИСТАВКОЙ api.
          url_tg = f"https://api.telegram.org/bot{token}/sendMessage"
          
          payload = {
              "chat_id": chat_id,
              "text": message_text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }

          if len(chat_id) > 10 and chat_id.startswith("822"):
              payload["message_thread_id"] = 38

          req_tg = urllib.request.Request(
              url_tg, 
              data=json.dumps(payload, ensure_ascii=False).encode('utf-8'), 
              headers={'Content-Type': 'application/json'}
          )
          
          try:
              with urllib.request.urlopen(req_tg) as response:
                  print("HTTP Status Code:", response.getcode())
          except Exception as e:
              print("Ошибка отправки в Telegram:", str(e))
              sys.exit(1)
