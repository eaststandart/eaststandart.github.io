name: Broadcast Personal Lessons Report via Chain Trigger

on:
  # ⚡ Робот просыпается строго после финиша вашего генератора отчетов
  workflow_run:
    workflows: ["Generate Attendance Report to Discussions"]
    types: [completed]

jobs:
  delivery-to-personal:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Latest Comment and Send to Telegram via Python
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_EASTEMITTING_PERSONAL_ID_38 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          import urllib.request
          import json
          import os
          import sys

          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          gh_token = os.environ.get("GH_TOKEN", "").strip()
          repo_full = os.environ.get("REPO_NAME", "").strip()
          
          owner, repo_name = repo_full.split("/")

          # ⚡ ОФИЦИАЛЬНЫЙ GRAPHQL ЗАПРОС К GITHUB ДЛЯ ДИСКУССИЙ
          url_gh = "https://github.com/api/graphql"
          
          # Запрашиваем последний комментарий из дискуссии №38
          graphql_query = {
              "query": f"""
              query {{
                repository(owner: "{owner}", name: "{repo_name}") {{
                  discussion(number: 38) {{
                    comments(last: 1) {{
                      nodes {{
                        body
                      }}
                    }}
                  }}
                }}
              }}
              """
          }

          headers_gh = {
              "Authorization": f"Bearer {gh_token}",
              "Content-Type": "application/json",
              "User-Agent": "GitHub-Actions-Robot"
          }

          req_gh = urllib.request.Request(
              url_gh, 
              data=json.dumps(graphql_query).encode('utf-8'), 
              headers=headers_gh
          )
          
          try:
              with urllib.request.urlopen(req_gh) as response:
                  res_data = json.loads(response.read().decode('utf-8'))
                  nodes = res_data['data']['repository']['discussion']['comments']['nodes']
                  if not nodes:
                      print("ℹ️ Новые комментарии не найдены.")
                      sys.exit(0)
                  raw_body = nodes[0]['body']
          except Exception as e:
              print("Ошибка получения данных с GitHub GraphQL API:", str(e))
              sys.exit(1)

          print("=== ЛОГ PYTHON: СЫРОЙ ТЕКСТ ИЗ ДИСКУССИИ №38 ===")
          print(repr(raw_body))
          print("=====================================================")

          clean_lines = []
          
          for line in raw_body.split("\n"):
              line_str = line.strip()
              
              if "| :---" in line_str or "Группа / Ученик" in line_str:
                  continue
                  
              if line_str.startswith("|"):
                  parts = [p.strip() for p in line_str.split("|") if p.strip()]
                  
                  if len(parts) >= 1:
                      # ⚡ ТОЧЕЧНОЕ ИСПРАВЛЕНИЕ: берем первый элемент из текстового массива
                      left_cell = parts[0].replace("**", "")
                      
                      if "ГРУППА" in left_cell or "⏰" in left_cell:
                          clean_lines.append(f"\n{left_cell}")
                          
                      elif len(parts) >= 2:
                          status_cell = parts[1]
                          emoji = "🟢" if "🟢" in status_cell else "🔴" if "🔴" in status_cell else ""
                          student_name = left_cell
                          clean_lines.append(f"{student_name} {emoji}")
                          
              elif "📅" in line_str or "Преподаватель:" in line_str or "Проверил" in line_str:
                  if "Журнал посещений за" in line_str:
                      date_part = line_str.split("за")[-1].replace("г.", "").replace("###", "").strip()
                      clean_lines.append(f"📅 Отчет за {date_part}")
                  elif "Преподаватель:" in line_str or "Проверил" in line_str:
                      raw_name = line_str.split(":")[-1].replace("*", "").strip()
                      clean_lines.append(f"\nПреподаватель: <b>{raw_name}</b>")
                  else:
                      clean_lines.append(line_str)

          message_text = "\n".join([l for l in clean_lines if l.strip()]).strip()

          print("=== ЛОГ PYTHON: СФОРМИРОВАННЫЙ ТЕКСТ ДЛЯ ЧЕЛОВЕКА ===")
          print(repr(message_text))
          print("=====================================================")

          if not message_text:
              print("ℹ️ Системное уведомление: Этот комментарий не является таблицей отчёта. Пропускаем.")
              sys.exit(0)

          # Отправка на боевой сервер Telegram
          url_tg = f"https://api.telegram.org/bot{token}/sendMessage"
          
          payload = {
              "chat_id": chat_id,
              "text": message_text,
              "parse_mode": "HTML",
              "disable_web_page_preview": True
          }

          if len(chat_id) > 10 and chat_id.startswith("822"):
              payload["message_thread_id"] = 38

          req_tg = urllib.request.Request(
              url_tg, 
              data=json.dumps(payload, ensure_ascii=False).encode('utf-8'), 
              headers={'Content-Type': 'application/json'}
          )
          
          print("=== ЛОГ PYTHON: ОТВЕТ СЕРВЕРА TELEGRAM API ===")
          try:
              with urllib.request.urlopen(req_tg) as response:
                  print("HTTP Status Code:", response.getcode())
                  print("Response:", response.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
              print("HTTP Error Code:", e.code)
              print("Response Body:", e.read().decode('utf-8'))
              sys.exit(1)
          except Exception as e:
              print("Ошибка отправки сети:", str(e))
              sys.exit(1)
          print("==============================================")
