name: Broadcast Personal Lessons Report via Chain Trigger

on:
  workflow_run:
    workflows: ["Generate Attendance Report to Discussions"]
    types: [completed]

concurrency:
  group: personal-delivery-group
  cancel-in-progress: false

jobs:
  research-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Research String Lengths and Spaces via Python
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          import urllib.request
          import json
          import os
          import sys

          gh_token = os.environ.get("GH_TOKEN", "").strip()
          repo_full = os.environ.get("REPO_NAME", "").strip()
          owner, repo_name = repo_full.split("/")

          # ⚡️ GRAPHQL АДРЕС GITHUB API: api . github . com / graphql
          url_gh = "https://api.github.com/graphql"
          
          graphql_query = {
              "query": f"""
              query {{
                repository(owner: "{owner}", name: "{repo_name}") {{
                  discussion(number: 38) {{
                    comments(last: 1) {{
                      nodes {{
                        body
                      }}
                    }}
                  }}
                }}
              }}
              """
          }

          headers_gh = {
              "Authorization": f"Bearer {gh_token}",
              "Content-Type": "application/json",
              "Accept": "application/vnd.github+json",
              "User-Agent": "GitHub-Actions-Robot"
          }

          req_gh = urllib.request.Request(url_gh, data=json.dumps(graphql_query).encode('utf-8'), headers=headers_gh)
          
          try:
              with urllib.request.urlopen(req_gh) as response:
                  res_data = json.loads(response.read().decode('utf-8'))
                  nodes = res_data['data']['repository']['discussion']['comments']['nodes']
                  if not nodes:
                      print("ℹ️ Комментарии не найдены.")
                      sys.exit(0)
                  raw_body = nodes['body']
          except Exception as e:
              print("❌ Ошибка забора данных:", str(e))
              sys.exit(1)

          # Сначала собираем все имена для поиска максимума
          names_list = []
          for line in raw_body.split("\n"):
              line_str = line.strip()
              if line_str.startswith("|") and not "Группа" in line_str and not ":---" in line_str:
                  parts = [p.strip() for p in line_str.split("|") if p.strip()]
                  if len(parts) >= 1:
                      left_cell = parts.replace("**", "")
                      if not "ГРУППА" in left_cell and not "⏰" in left_cell:
                          names_list.append(left_cell)

          if not names_list:
              print("ℹ️ Список учеников пуст.")
              sys.exit(0)

          # Вычисляем самое длинное слово + 2 пробела
          text_line = max(len(n) for n in names_list) + 2

          print("=====================================================")
          print("🔍 ЛОГ ИССЛЕДОВАНИЯ ВЫРАВНИВАНИЯ И ДЛИН СТРОК:")
          print("=====================================================")
          print(f"• Длина самого длинного имени дня + 2 пробела (text_line): {text_line} символов")
          print("-----------------------------------------------------")

          clean_lines = []
          for line in raw_body.split("\n"):
              line_str = line.strip()
              if "| :---" in line_str or "Группа / Ученик" in line_str:
                  continue
              if line_str.startswith("|"):
                  parts = [p.strip() for p in line_str.split("|") if p.strip()]
                  if len(parts) >= 1:
                      left_cell = parts.replace("**", "")
                      if "ГРУППА" in left_cell or "⏰" in left_cell:
                          clean_lines.append(f"\n{left_cell}")
                      elif len(parts) >= 2:
                          status_cell = parts
                          emoji = "🟢" if "🟢" in status_cell else "🔴" if "🔴" in status_cell else ""
                          
                          # Формируем и замеряем строку с ljust
                          aligned_name = left_cell.ljust(text_line)
                          final_line = f"{aligned_name}{emoji}"
                          
                          # Выводим подробный замер в лог
                          print(f"Имя: {repr(left_cell.ljust(text_line))} | Итоговая длина до шарика: {len(aligned_name)} симв.")
                          clean_lines.append(final_line)

          print("-----------------------------------------------------")
          print("ℹ️ Сбор логов завершён. Жду данные для анализа.")
          print("=====================================================")
