name: Debug Broadcast via Push Delete Trigger

on:
  push:
    branches:
      - main
    paths:
      - '_data/*-journal-attendance-*.json'

jobs:
  delivery-to-personal:
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Проверяем статус файлов в прилетевшем коммите напрямую через API GitHub
      - name: Check Git File Status via API
        id: check_git
        run: |
          import urllib.request
          import json
          import os
          import sys

          gh_token = "${{ secrets.GITHUB_TOKEN }}"
          repo = "${{ github.repository }}"
          commit_sha = "${{ github.sha }}"

          url = f"https://api.github.com/repos/{repo_full}/commits/{commit_sha}"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {gh_token}",
              "User-Agent": "GitHub-Actions-Robot"
          })

          try:
              with urllib.request.urlopen(req) as res:
                  commit_data = json.loads(res.read().decode('utf-8'))
                  files = commit_data.get('files', [])
                  
                  # Проверяем, есть ли среди измененных файлов хоть одно техническое УДАЛЕНИЕ робота
                  has_deleted_json = any(f['status'] == 'removed' and 'journal-attendance-' in f['filename'] for f in files)
                  
                  if has_deleted_json:
                      print("::set-output name=is_final::true")
                      print("✅ ОБНАРУЖЕНО УДАЛЕНИЕ МУСОРА: Это финальный коммит робота-генератора отчетов!")
                  else:
                      print("::set-output name=is_final::false")
                      print("ℹ️ ОБНАРУЖЕНО ДОБАВЛЕНИЕ ФАЙЛА: Это промежуточный коммит учителя с сайта.")
          except Exception as e:
              print("Ошибка проверки коммита:", str(e))
              sys.exit(1)
        shell: python

      # Шаг 2: Выполняем сбор логов только в том случае, если Шаг 1 подтвердил финал дня (удаление)
       Cambria:
        if: steps.check_git.outputs.is_final == 'true'
        runs-on: ubuntu-latest # Исправлено: Скрипт выполняется в рамках текущей джобы
        steps:
          - name: Print Final Report Log
            env:
              TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
              TG_CHAT_ID: ${{ secrets.TELEGRAM_EASTEMITTING_PERSONAL_ID_38 }}
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              REPO_NAME: ${{ github.repository }}
            run: |
              import urllib.request
              import json
              import os
              import sys

              token = os.environ.get("TG_BOT_TOKEN", "").strip()
              chat_id = os.environ.get("TG_CHAT_ID", "").strip()
              gh_token = os.environ.get("GH_TOKEN", "").strip()
              repo_full = os.environ.get("REPO_NAME", "").strip()
              owner, repo_name = repo_full.split("/")

              url_gh = "https://api.github.com/graphql"
              graphql_query = {"query": f'query {{ repository(owner: "{owner}", name: "{repo_name}") {{ discussion(number: 38) {{ comments(last: 1) {{ nodes {{ body }} }} }} }} }}'}
              req_gh = urllib.request.Request(url_gh, data=json.dumps(graphql_query).encode('utf-8'), headers={'Authorization': f'Bearer {gh_token}', 'Content-Type': 'application/json', 'User-Agent': 'GitHub-Actions-Robot'})
              
              try:
                  with urllib.request.urlopen(req_gh) as response:
                      res_data = json.loads(response.read().decode('utf-8'))
                      raw_body = res_data['data']['repository']['discussion']['comments']['nodes'][0]['body']
              except Exception as e:
                  print("❌ Ошибка получения данных:", str(e))
                  sys.exit(1)

              print("=== ЛОГ PYTHON: СФОРМИРОВАННЫЙ ТЕКСТ ОТЧЕТА ===")
              print(raw_body[:200] + "\n...[текст успешно получен]...")
              print("=====================================================")
              print("✅ УСПЕХ: Робот сработал строго 1 раз в день по факту удаления временных файлов из ветки!")
