name: Broadcast Personal Lessons Report via Chain Trigger

on:
  workflow_run:
    workflows: ["Generate Attendance Report to Discussions"]
    types: [completed]

jobs:
  trace-publication-moment:
    runs-on: ubuntu-latest
    steps:
      - name: Trace Step Logs and Mutation Moment via Python
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          import urllib.request
          import json
          import os
          import sys

          gh_token = os.environ.get("GH_TOKEN", "").strip()
          repo_full = os.environ.get("REPO_NAME", "").strip()
          run_id = os.environ.get("RUN_ID", "").strip()
          run_num = os.environ.get("RUN_NUMBER", "").strip()

          headers = {
              "Authorization": f"Bearer {gh_token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "GitHub-Actions-Robot"
          }

          # 🎯 ЗАПРОС №1: Получаем детальный статус всех шагов первого бота внутри текущего запуска
          url_jobs = f"https://api.github.com/repos/{repo_full}/actions/runs/{run_id}/jobs"
          req_jobs = urllib.request.Request(url_jobs, headers=headers)

          print("=====================================================")
          print(f"⚡️ АНАЛИЗ ПРОГОНА РОБОТА-ГЕНЕРАТОРА №{run_num} (RUN ID: {run_id})")
          print("=====================================================")

          try:
              with urllib.request.urlopen(req_jobs) as response:
                  jobs_data = json.loads(response.read().decode('utf-8'))
                  for job in jobs_data.get("jobs", []):
                      print(f"Статус задачи '{job.get('name')}': {job.get('conclusion')}")
                      print("-----------------------------------------------------")
                      print("⏱️ Лог выполнения шагов внутри задачи:")
                      for step in job.get("steps", []):
                          # Выводим точное время начала и конца каждого шага первого бота
                          print(f" • Шаг: [{step.get('name')}] | Статус: {step.get('conclusion')} | Начало: {step.get('started_at')} | Конец: {step.get('completed_at')}")
          except Exception as e:
              print("❌ Ошибка получения шагов выполнения:", str(e))

          # 🎯 ЗАПРОС №2: Проверяем, менялся ли состав файлов в коммите, который вызвал этот запуск
          url_run = f"https://api.github.com/repos/{repo_full}/actions/runs/{run_id}/jobs"
          req_run = urllib.request.Request(url_run, headers=headers)
          
          print("\n=====================================================")
          print("📋 ПРОВЕРКА ДАННЫХ ИСТОЧНИКА ДЛЯ ЭТОГО ЗАПУСКА")
          print("=====================================================")
          try:
              with urllib.request.urlopen(req_run) as response:
                  run_info = json.loads(response.read().decode('utf-8'))
                  commit_sha = run_info.get("head_sha", "")
                  
                  # Запрашиваем информацию о коммите, чтобы увидеть, какие файлы менялись
                  url_commit = f"https://api.github.com/repos/{repo_full}/commits/{commit_sha}"
                  req_commit = urllib.request.Request(url_commit, headers=headers)
                  
                  with urllib.request.urlopen(req_commit) as res_commit:
                      commit_data = json.loads(res_commit.read().decode('utf-8'))
                      print(f"Автор триггера: {commit_data.get('commit', {}).get('author', {}).get('name')}")
                      print(f"Сообщение: {commit_data.get('commit', {}).get('message', '').strip()}")
                      print("Измененные файлы в этом раунде:")
                      for f in commit_data.get("files", []):
                          print(f"  - [{f.get('status')}] {f.get('filename')}")
          except Exception as e:
              print("❌ Ошибка анализа коммита:", str(e))
              
          print("=====================================================")
          print("ℹ️ Сбор системных следов завершен.")
          print("=====================================================")
