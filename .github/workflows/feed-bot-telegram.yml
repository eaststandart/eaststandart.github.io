name: Universal Telegram Broadcast Dispatcher

on:
  discussion_comment:
    types: [created]

jobs:
  # =========================================================================
  # 🏢 БЛОК №1: РЕГУЛЯРНЫЕ ЗАНЯТИЯ (ВЕТКА №38) - В ОБЩИЙ ЧАТ В СТАНДАРТЕ
  # =========================================================================
  telegram-lessons-38:
    runs-on: ubuntu-latest
    steps:
      - name: Filter and Prepare Message Data
        id: parse_data
        run: |
          CLEAN_NUM=$(echo "${{ github.event.discussion.number }}" | tr -cd '0-9')
          if [ "$CLEAN_NUM" != "38" ]; then
            echo "PROCEED=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "PROCEED=true" >> $GITHUB_ENV

          RAW_BODY=$(cat << 'EOF'
          ${{ github.event.comment.body }}
          EOF
          )
          URL=$(echo "$RAW_BODY" | grep -o -E 'https://github.com[^") ]+' | head -n 1)
          if [ -z "$URL" ]; then
            URL=$(echo "$RAW_BODY" | grep -o -E 'https://github-production-user-asset[^") ]+' | head -n 1)
          fi
          if [ -z "$URL" ]; then
            URL="${{ github.event.comment.html_url }}"
          fi
          echo "media_url=$URL" >> $GITHUB_OUTPUT

      - name: Send Standardized Minimal Card to General Chat via Python
        if: env.PROCEED == 'true'
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_URL: ${{ steps.parse_data.outputs.media_url }}
          DISC_TITLE: ${{ github.event.discussion.title }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          import urllib.request
          import json
          import os
          import sys

          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          title = os.environ.get("DISC_TITLE", "").strip()

          # Наш строгий стандарт: заголовок из GitHub и рупор про медиа-материалы
          message_text = (
              f'<a href="{os.environ.get("MEDIA_URL")}">&#8203;</a><b>{title}</b>\n\n'
              f'📢 В Дискуссиях клуба опубликованы новые медиа-материалы!\n\n'
              f'📥 <a href="{os.environ.get("COMMENT_URL")}">Посмотреть фото и видео на GitHub</a>'
          )

          base_host = "https://telegram.org"
          endpoint = "/bot" + token + "/sendMessage"
          url = base_host + endpoint
          
          payload = {
              "chat_id": chat_id,
              "text": message_text,
              "parse_mode": "HTML",
              "disable_web_page_preview": False
          }

          print("=== ЛОГ PYTHON (ВЕТКА 38): ОТПРАВЛЯЕМЫЙ JSON ===")
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          print("================================================")

          req = urllib.request.Request(url, data=json.dumps(payload, ensure_ascii=False).encode('utf-8'), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req) as response:
                  print("HTTP Status Code:", response.getcode())
          except Exception as e:
              sys.exit(1)

  # =========================================================================
  # 🎨 БЛОК №2: ТВОРЧЕСКИЙ ПРОЦЕСС (ВЕТКА №83) - СТРОГО В ТОПИК №45 В СТАНДАРТЕ
  # =========================================================================
  telegram-creative-83:
    runs-on: ubuntu-latest
    steps:
      - name: Filter and Clean Message Data
        id: parse_data
        run: |
          CLEAN_NUM=$(echo "${{ github.event.discussion.number }}" | tr -cd '0-9')
          if [ "$CLEAN_NUM" != "83" ]; then
            echo "PROCEED=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "PROCEED=true" >> $GITHUB_ENV

          RAW_BODY=$(cat << 'EOF'
          ${{ github.event.comment.body }}
          EOF
          )
          URL=$(echo "$RAW_BODY" | grep -o -E 'https://github.com[^") ]+' | head -n 1)
          if [ -z "$URL" ]; then
            URL=$(echo "$RAW_BODY" | grep -o -E 'https://github-production-user-asset[^") ]+' | head -n 1)
          fi
          if [ -z "$URL" ]; then
            URL="${{ github.event.comment.html_url }}"
          fi
          echo "media_url=$URL" >> $GITHUB_OUTPUT

      - name: Send Standardized Card to Telegram Topic via Python
        if: env.PROCEED == 'true'
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_URL: ${{ steps.parse_data.outputs.media_url }}
          DISC_TITLE: ${{ github.event.discussion.title }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          import urllib.request
          import json
          import os
          import sys

          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          title = os.environ.get("DISC_TITLE", "").strip()

          # Наш строгий стандарт: заголовок из GitHub и рупор про журнал посещений
          message_text = (
              f'<a href="{os.environ.get("MEDIA_URL")}">&#8203;</a><b>{title}</b>\n\n'
              f'📢 В Дискуссиях клуба обновлён журнал посещений!\n\n'
              f'📥 <a href="{os.environ.get("COMMENT_URL")}">Посмотреть фото и видео на GitHub</a>'
          )

          base_host = "https://api.telegram.org"
          endpoint = "/bot" + token + "/sendMessage"
          url = base_host + endpoint
          
          payload = {
              "chat_id": chat_id,
              "message_thread_id": 45,
              "text": message_text,
              "parse_mode": "HTML",
              "disable_web_page_preview": False
          }

          print("=== ЛОГ PYTHON (ВЕТКА 83): ОТПРАВЛЯЕМЫЙ JSON ===")
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          print("================================================")

          req = urllib.request.Request(url, data=json.dumps(payload, ensure_ascii=False).encode('utf-8'), headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(req) as response:
                  print("HTTP Status Code:", response.getcode())
          except Exception as e:
              sys.exit(1)
