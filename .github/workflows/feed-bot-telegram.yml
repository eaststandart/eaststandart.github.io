name: Universal Telegram Broadcast Dispatcher

on:
  discussion_comment:
    types: [created]

jobs:
  telegram-broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Filter and Route Message Data
        id: parse_data
        run: |
          # 1. Сборка и очистка номера дискуссии
          CURRENT_DISCUSSION="${{ github.event.discussion.number }}"
          CLEAN_NUM=$(echo "$CURRENT_DISCUSSION" | tr -cd '0-9')
          
          if [ "$CLEAN_NUM" != "83" ] && [ "$CLEAN_NUM" != "38" ]; then
            echo "PROCEED=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "PROCEED=true" >> $GITHUB_ENV

          # 2. ПОИСК ПЕРВОГО МЕДИА ДЛЯ ОБЛОЖКИ (Раздельный бронебойный поиск)
          RAW_BODY=$(cat << 'EOF'
          ${{ github.event.comment.body }}
          EOF
          )
          URL=$(echo "$RAW_BODY" | grep -o -E 'https://github.com[^") ]+' | head -n 1)
          if [ -z "$URL" ]; then
            URL=$(echo "$RAW_BODY" | grep -o -E 'https://github-production-user-asset[^") ]+' | head -n 1)
          fi
          if [ -z "$URL" ]; then
            URL="${{ github.event.comment.html_url }}"
          fi
          echo "media_url=$URL" >> $GITHUB_OUTPUT

      - name: Send Standardized Dynamic Card to Telegram Topic via Python
        if: env.PROCEED == 'true'
        shell: python
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEDIA_URL: ${{ steps.parse_data.outputs.media_url }}
          DISC_TITLE: ${{ github.event.discussion.title }}
          DISC_NUM: ${{ github.event.discussion.number }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          import urllib.request
          import json
          import os
          import sys

          token = os.environ.get("TG_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TG_CHAT_ID", "").strip()
          disc_num = str(os.environ.get("DISC_NUM", "")).strip().replace("#", "")

          # 🎯 АВТОМАТИЧЕСКИЙ ДИСПЕТЧЕР ТОПИКОВ И ТЕКСТОВЫХ РУПОРОВ
          # Вариант 1: Ветка №83 (Журнал посещений) -> в топик 45
          if disc_num == "83":
              target_thread_id = 45
              announcement_text = "📢 В Дискуссиях клуба обновлён журнал посещений!"
          
          # Вариант 2: Ветка №38 (Регулярные занятия) -> в топик 38
          elif disc_num == "38":
              target_thread_id = 38
              announcement_text = "📢 В Дискуссиях клуба опубликованы новые медиа-материалы!"
          
          else:
              sys.exit(0)

          # Забираем и бережно очищаем заголовок дискуссии
          clean_title = os.environ.get("DISC_TITLE", "").strip()

          # Сборка нашего единого согласованного стандарта карточки
          message_text = (
              f'<a href="{os.environ.get("MEDIA_URL")}">&#8203;</a><b>{clean_title}</b>\n\n'
              f'{announcement_text}\n\n'
              f'📥 <a href="{os.environ.get("COMMENT_URL")}">Посмотреть фото и видео на GitHub</a>'
          )

          # Жёсткий адрес API без парсинга двоеточия хостом
          base_host = "https://api.telegram.org"
          endpoint = "/bot" + token + "/sendMessage"
          url = base_host + endpoint
          
          payload = {
              "chat_id": chat_id,
              "message_thread_id": target_thread_id,
              "text": message_text,
              "parse_mode": "HTML",
              "disable_web_page_preview": False
          }

          # ⚙️ ЛОГ №1: Выводим снимок того, что отправляется в мессенджер
          print("=== ЛОГ PYTHON: ОТПРАВЛЯЕМЫЙ JSON ПАКЕТ ===")
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          print("===========================================")

          req = urllib.request.Request(
              url, 
              data=json.dumps(payload, ensure_ascii=False).encode('utf-8'), 
              headers={'Content-Type': 'application/json'}
          )
          
          # ⚡ ОТПРАВКА С ТОТАЛЬНЫМ ВЫВОДОМ ЛОГОВ ОТВЕТА СЕТИ
          print("=== ЛОГ PYTHON: ОТВЕТ СЕРВЕРА TELEGRAM API ===")
          try:
              with urllib.request.urlopen(req) as response:
                  print("HTTP Status Code:", response.getcode())
                  print("Response Body:", response.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
              print("HTTP Error Code:", e.code)
              print("Error Response Body:", e.read().decode('utf-8'))
              sys.exit(1)
          except Exception as e:
              print("Системная сетевая ошибка:", str(e))
              sys.exit(1)
          print("==============================================")
