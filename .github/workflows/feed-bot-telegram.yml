name: Universal Telegram Broadcast Dispatcher

on:
  discussion_comment:
    types: [created]

jobs:
  telegram-broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Filter and Route Message Data
        id: parse_data
        run: |
          # 1. Проверка дискуссий
          CURRENT_DISCUSSION="${{ github.event.discussion.number }}"
          CLEAN_NUM=$(echo "$CURRENT_DISCUSSION" | tr -cd '0-9')
          
          if [ "$CLEAN_NUM" != "83" ] && [ "$CLEAN_NUM" != "38" ]; then
            echo "PROCEED=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "PROCEED=true" >> $GITHUB_ENV

          # Переключаем топик Telegram в зависимости от номера дискуссии
          if [ "$CLEAN_NUM" = "83" ]; then
            echo "target_topic=45" >> $GITHUB_OUTPUT
          elif [ "$CLEAN_NUM" = "38" ]; then
            echo "target_topic=38" >> $GITHUB_OUTPUT
          fi

          # 2. ПОИСК ОБЛОЖКИ
          RAW_BODY=$(cat << 'EOF'
          ${{ github.event.comment.body }}
          EOF
          )
          URL=$(echo "$RAW_BODY" | grep -o -E 'https://github.com[^") ]+' | head -n 1)
          if [ -z "$URL" ]; then
            URL=$(echo "$RAW_BODY" | grep -o -E 'https://github-production-user-asset[^") ]+' | head -n 1)
          fi
          if [ -z "$URL" ]; then
            URL="${{ github.event.comment.html_url }}"
          fi
          echo "media_url=$URL" >> $GITHUB_OUTPUT

      - name: Send Standardized Card to Telegram (HTML Pro Style)
        if: env.PROCEED == 'true'
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: "${{ secrets.TELEGRAM_CHAT_ID }}_${{ steps.parse_data.outputs.target_topic }}"
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          # ⚙️ ВКЛЮЧАЕМ ЛОГИРОВАНИЕ ПЛАГИНА ДЛЯ ПОИСКА ОШИБКИ
          debug: true
          disable_web_page_preview: false
          message: |
            <a href="${{ steps.parse_data.outputs.media_url }}">&#8203;</a><b>${{ github.event.discussion.title }}</b> (Ветка #${{ github.event.discussion.number }})

            📢 В репозитории клуба опубликованы новые медиа-материалы!

            📥 <a href="${{ github.event.comment.html_url }}">Посмотреть фото и видео на GitHub</a>
