name: Broadcast Discussion Comments to Telegram

on:
  discussion_comment:
    types: [created]

jobs:
  telegram-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Filter and Clean Message Data
        id: parse_data
        run: |
          # 1. Проверка разрешенных веток
          ALLOWED_DISCUSSIONS="38"
          CURRENT_DISCUSSION="${{ github.event.discussion.number }}"
          
          if ! echo "$ALLOWED_DISCUSSIONS" | grep -qw "$CURRENT_DISCUSSION"; then
            echo "PROCEED=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "PROCEED=true" >> $GITHUB_ENV

          # 2. Забираем сырой текст комментария
          RAW_BODY=$(cat << 'EOF'
          ${{ github.event.comment.body }}
          EOF
          )

          # 3. ПОИСК ПЕРВОГО МЕДИА ДЛЯ ОБЛОЖКИ
          URL=$(echo "$RAW_BODY" | grep -o -E 'https://github.com[^") ]+' | head -n 1)
          
          echo "=== ТЕСТ АВТОМАТИКИ TECHLAB ==="
          echo "Робот нашел обложку: '$URL'"
          echo "==============================="

          echo "media_url=$URL" >> $GITHUB_OUTPUT

          # 4. УМНАЯ ОЧИСТКА В ПЛОСКИЙ ТЕКСТ
          # Схлопываем конструкции картинок в тегах <a> и <img> в слово [Медиа]
          CLEAN_BODY=$(echo "$RAW_BODY" | sed -E 's|<a[^>]*>[[:space:]]*<img[^>]*>[[:space:]]*</a>|<b>[Медиа]</b>|g')
          
          # Подчищаем одиночные теги <img> и Markdown-картинки
          CLEAN_BODY=$(echo "$CLEAN_BODY" | sed -E 's|!\[[^]]*\]\(https://[^)]+\)|<b>[Медиа]</b>|g' | sed -E 's|<img[^>]*>|<b>[Медиа]</b>|g')
          
          # Вырезаем обертки тегов div
          CLEAN_BODY=$(echo "$CLEAN_BODY" | sed -E 's|<div[^>]*>||g' | sed -E 's|</div>||g')

          # ⚡ ЖЕЛЕЗНОЕ СХЛОПЫВАНИЕ ПОСТРОЧНЫМ ЦИКЛОМ (Убираем забор из маркеров)
          COMPRESSED_BODY=""
          LAST_WAS_MEDIA=false

          # Заменяем переносы строк на временный разделитель, чтобы надежно прочитать каждую строчку
          echo "$CLEAN_BODY" | while IFS= read -r line; do
            # Убираем пробелы по краям строки для точной проверки
            TRIMMED_LINE=$(echo "$line" | sed -E 's/^[[:space:]]*//;s/[[:space:]]*$//')
            
            if [ "$TRIMMED_LINE" = "<b>[Медиа]</b>" ]; then
              if [ "$LAST_WAS_MEDIA" = false ]; then
                COMPRESSED_BODY+="$line"$'\n'
                LAST_WAS_MEDIA=true
              fi
            else
              if [ ! -z "$TRIMMED_LINE" ]; then
                COMPRESSED_BODY+="$line"$'\n'
                LAST_WAS_MEDIA=false
              else
                # Пропускаем пустые строки, если до этого шло медиа, чтобы сжать дыры
                if [ "$LAST_WAS_MEDIA" = false ]; then
                  COMPRESSED_BODY+="$line"$'\n'
                fi
              fi
            fi
          done

          # Финальное сжатие случайных пустых строк на выходе
          COMPRESSED_BODY=$(echo "$COMPRESSED_BODY" | sed 's/[[:space:]]*$//' | tr -s '\n')

          # Сохраняем итоговый текст в память робота
          echo "clean_text<<EOF" >> $GITHUB_OUTPUT
          echo "$COMPRESSED_BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Standardized Card to Telegram (HTML Pro Style)
        if: env.PROCEED == 'true'
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: false
          message: |
            <a href="${{ steps.parse_data.outputs.media_url }}">&#8203;</a> <b>${{ github.event.discussion.title }}</b> (Ветка #${{ github.event.discussion.number }})

            💬 <b>Текст:</b>
            ${{ steps.parse_data.outputs.clean_text }}

            👤 <b>Автор:</b> @${{ github.event.comment.user.login }}
            ───────────────────
            📥 <a href="${{ github.event.comment.html_url }}">Посмотреть и ответить на GitHub</a>
