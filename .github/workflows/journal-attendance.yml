# ==============================================================================
# @module  journal-attendance.yml
# @about   Сценарий автоматизации конвейера журнала посещений на стороне сайта
# @purpose Считывание баз данных из репозитория журнала и запуск главного диспетчера
# @author  TechLab
# @version 1.4.0
# ==============================================================================

name: Generate Attendance Report to Discussions 

on:
  repository_dispatch:     # ТОЧЕЧНАЯ ПРАВКА 1: Переключаем запуск на удаленный сигнал
    types: [journal_submission]

permissions:
  contents: write
  discussions: write

jobs:
  build_report:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем программные скрипты Python и код самого сайта
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ТОЧЕЧНАЯ ПРАВКА 2: Скачиваем файлы баз данных из приватного репозитория Журнала
      - name: Download Data From Isolated Repository
        uses: actions/checkout@v4
        with:
          repository: 'eaststandart/techlab-journal-attendance'
          token: ${{ secrets.MY_ADMIN_TOKEN }}
          path: '_data_core'

      # ТОЧЕЧНАЯ ПРАВКА 3: Временно переносим папку _data в корень для работы Python
      - name: Prepare Workspace Data
        run: cp -r _data_core/_data .

      # 2. Настраиваем окружение Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Устанавливаем библиотеки для работы скрипта
      - name: Install Dependencies
        run: |
          pip install pyyaml requests

      # 4. Запускаем Главный Диспетчер конвейера (Публикация от родного Бота сайта!)
      - name: Run Python Report Generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MY_ADMIN_TOKEN: ${{ secrets.MY_ADMIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python _actions/journalattendance.py
