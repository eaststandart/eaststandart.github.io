name: Generate Attendance Report to Discussions 

on:
  push:
    paths:
      - '_data/*-journal-attendance-*.json'

permissions:
  contents: write
  discussions: write

jobs:
  build_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Dynamic Report Generator
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MY_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const dataDir = path.join(process.env.GITHUB_WORKSPACE, '_data');
            
            // 1. Ищем все временные файлы групп за сегодняшний день
            const allFiles = fs.readdirSync(dataDir);
            const groupFiles = allFiles.filter(f => f.includes('-journal-attendance-') && f.endsWith('.json'));
            
            if (groupFiles.length === 0) {
              console.log("=== ЛОГ РОБОТА ===");
              console.log("Временные файлы журналов групп не найдены.");
              return;
            }

            // Читаем первый попавшийся файл, чтобы определить текущий день недели и дату
            const sampleData = JSON.parse(fs.readFileSync(path.join(dataDir, groupFiles[0]), 'utf8'));
            const targetDay = sampleData.day.toLowerCase().trim();
            const dateStr = sampleData.date;
            const teacherUsername = sampleData.teacher_username || "Преподаватель";

            console.log("=== ЛОГ РОБОТА: ИНИЦИАЛИЗАЦИЯ ===");
            console.log(`Обнаружена дата занятия: ${dateStr} (${targetDay})`);

            // Filter файлов строго за эту дату (на случай если остались старые)
            const todaysFiles = groupFiles.filter(f => f.startsWith(`${dateStr}-`));

            // 2. Читаем YAML расписание, чтобы понять сколько групп должно быть
            const yamlPath = path.join(dataDir, `journal-attendance-${sampleData.teacher_login}.yml`);
            if (!fs.existsSync(yamlPath)) {
              console.log(`КРИТИЧЕСКАЯ ОШИБКА: Личный файл не найден по пути: ${yamlPath}`);
              return;
            }

            let yamlText = fs.readFileSync(yamlPath, 'utf8');
            let studentsData = {};
            let currentDay = "";
            let currentGroup = "";
            
            // Новые переменные для динамического сбора индивидуальных настроек учителя (ИСПРАВЛЕНО: дефолт false!)
            let configData = {
              publish_as_bot: true, // Возвращено исходное рабочее значение по умолчанию
              show_projects_column: true,
              discussion_number: 38,
              project_category_name: [] 
            };
            let insideConfig = false;
            let currentConfigKey = ""; // Отслеживаем, какой ключ конфигурации сейчас парсится

            const lines = yamlText.split('\n');
            lines.forEach(line => {
              const trimmed = line.trimEnd();
              if (!trimmed || trimmed.startsWith('#')) return;
              
              const indent = line.search(/\S/);
              const cleanText = trimmed.trim();

              // Ищем начало блока конфигурации преподавателя
              if (indent === 0 && cleanText === 'config:') {
                insideConfig = true;
                return;
              }

              // Если мы внутри блока config и парсится список на дефисах (ИСПРАВЛЕНО: удален слэш \ перед знаками \$)
              if (insideConfig && indent === 4 && cleanText.startsWith('-')) {
                const cleanValue = cleanText.substring(cleanText.indexOf('-') + 1).trim().replace(/^["']|["']\$/g, "");
                console.log(`[РАДАР ПАРСЕРА CONFIG] Обнаружен элемент списка: "${cleanValue}" для ключа "${currentConfigKey}"`);
                if (currentConfigKey === 'project_category_name' && cleanValue) {
                  configData.project_category_name.push(cleanValue);
                }
                return;
              }

              // Как только встретили новый блок на нулевом отступе (день недели), выходим из режима config
              if (indent === 0 && cleanText.endsWith(':') && cleanText !== 'config:') {
                insideConfig = false;
                currentDay = cleanText.slice(0, -1).toLowerCase().trim();
                studentsData[currentDay] = {};
                return;
              } 
              
              // Штатный сбор групп расписания
              if (!insideConfig && indent === 2 && cleanText.endsWith(':')) {
                currentGroup = cleanText.slice(0, -1).replace(/"/g, '').replace(/'/g, '').trim();
                studentsData[currentDay][currentGroup] = [];
              } 
              // Штатный сбор учеников расписания
              else if (!insideConfig && indent === 4 && cleanText.startsWith('-')) {
                const rawName = cleanText.substring(cleanText.indexOf('-') + 1).trim();
                const name = rawName.replace(/^["']|["']\$/g, "").trim();
                if (currentDay && currentGroup && studentsData[currentDay][currentGroup]) {
                  studentsData[currentDay][currentGroup].push(name);
                }
              }
            });

            console.log("=== ЛОГ РОБОТА: ИНДИВИДУАЛЬНЫЕ НАСТРОЙКИ УЧИТЕЛЯ ===");
            console.log(`Режим публикации через Бота: ${configData.publish_as_bot}`);
            console.log(`Показывать колонку проектов: ${configData.show_projects_column}`);
            console.log(`Целевой номер Дискуссии: #${configData.discussion_number}`);
            console.log(`Категории для поиска поделок: ${JSON.stringify(configData.project_category_name)}`);

            const scheduleGroups = studentsData[targetDay] ? Object.keys(studentsData[targetDay]).sort() : [];
            // 3. ПОДРОБНОЕ ЛОГИРОВАНИЕ И ПРОВЕКА КОМПЛЕКТНОСТИ
            console.log("=== ЛОГ РОБОТА: ПРОВЕРКА РАСПИСАНИЯ ===");
            
            // Собираем данные из прилетевших файлов во временный объект
            let tempJournal = {};
            todaysFiles.forEach(file => {
              const fileData = JSON.parse(fs.readFileSync(path.join(dataDir, file), 'utf8'));
              console.log(`\n=== [РАДАР JSON С САЙТА] ===`);
              console.log(`Файл: ${file}, группа: ${fileData.time}`);
              if (fileData.newbies) console.log(`Новички в JSON: ${JSON.stringify(fileData.newbies)}`);
              if (fileData.present_permanent) console.log(`Постоянные в JSON: ${JSON.stringify(fileData.present_permanent)}`);
              tempJournal[fileData.time] = fileData;
            });
            
            const filledTimes = Object.keys(tempJournal).sort();
            console.log("Полученные группы с сайта за сегодня:", JSON.stringify(filledTimes));

            // Если прилетели еще не все группы, которые есть в расписании на этот день
            if (filledTimes.length < scheduleGroups.length) {
              console.log("=== СТАТУС СБОРКИ ===");
              console.log(`Ожидаем остальные группы. Комплект не собран (${filledTimes.length} из ${scheduleGroups.length}). Завершаем шаг.`);
              return;
            }

            console.log("=== СТАТУС СБОРКИ ===");
            console.log("Все группы дня получены! Запускаем склейку и генерацию итогового отчета...");

            // === ШАГ 1: ГЛОБАЛЬНЫЙ СБОР ВСЕХ ПОДЕЛКОВ ИЗ КАТЕГОРИИ ЧЕРЕЗ API (ИСПРАВЛЕНО: привязка к configData!)
            const showProjects = configData.show_projects_column;
            const dateParts = dateStr.split('-');
            const formattedDate = `${dateParts[2]}.${dateParts[1]}.${dateParts[0]} г.`;

            let markdownBody = `### 📅 Журнал посещений за ${formattedDate} (${sampleData.day})\n\n`;
            if (showProjects) {
              markdownBody += `| Группа / Ученик | Статус | Направление | Чем занят? |\n`;
              markdownBody += `| :--- | :--- | :--- | :--- |\n`;
            } else {
              markdownBody += `| Группа / Ученик | Статус | Направление |\n`;
              markdownBody += `| :--- | :--- | :--- |\n`;
            }

            // Функция латинского транслита для генерации тегов
            function translitRusToLat(text) {
              const rus = "а б в г д е ё ж з и й к л м н о п р с т у ф х ц ч ш щ ъ ы ь э ю я".split(" ");
              const lat = "a b v g d e yo zh z i y k l m n o p r s t u f kh ts ch sh shch  y  e yu ya".split(" ");
              let res = "";
              let lower = text.toLowerCase();
              for (let i = 0; i < lower.length; i++) {
                let char = lower[i];
                let idx = rus.indexOf(char);
                if (idx !== -1) {
                  res += lat[idx];
                } else if (char === " " || char === "-") {
                  res += "-";
                } else if (/[a-z0-9_]/.test(char)) {
                  res += char;
                }
              }
              return res.replace(/-+/g, "-").replace(/^-|-$/g, "");
            }

            // Глобальный поисковый массив комментов со всей Галереи репозитория (ИСПРАВЛЕНО: сканирование списка категорий!)
            let globalGalleryComments = [];
            if (showProjects) {
              // Переводим весь список категорий учителя в нижний регистр для безопасного текстового сравнения
              const searchCategoriesLower = configData.project_category_name.map(cat => cat.toLowerCase().trim());
              console.log(`[ШАГ 1] Запуск глобального сканирования категорий: ${JSON.stringify(configData.project_category_name)}`);
              
              const searchGql = `query {
                repository(owner: "${context.repo.owner}", name: "${context.repo.repo}") {
                  discussions(first: 100, categoryId: null) {
                    nodes {
                      category { name }
                      comments(first: 100) {
                        nodes {
                          url
                          createdAt
                          body
                        }
                      }
                    }
                  }
                }
              }`;
              
              try {
                const resSearch = await github.graphql(searchGql);
                const discs = resSearch.repository.discussions.nodes || [];
                
                console.log(`\n=== [РАДАР КАТЕГОРИЙ GITHUB] ===`);
                const allRepoCategories = [...new Set(discs.map(d => d.category ? d.category.name : null).filter(Boolean))];
                console.log(`Обнаружены категории в Discussions: ${JSON.stringify(allRepoCategories)}`);
                console.log(`================================\n`);

                // ИСПРАВЛЕНО НАЧИСТО: Проверяем, входит ли имя категории топика в наш настроечный массив searchCategoriesLower (ДОБАВЛЕН РАДАР ФИЛЬТРА!)
                const targetDiscs = discs.filter(d => {
                  const isMatch = d.category && d.category.name && searchCategoriesLower.includes(d.category.name.toLowerCase().trim());
                  if (d.category && d.category.name) {
                    console.log(`[РАДАР СЛОВАЦО] Топик категории "${d.category.name}": подходит по фильтру? ${isMatch}. Комментов в нем: ${d.comments && d.comments.nodes ? d.comments.nodes.length : 0}`);
                  }
                  return isMatch;
                });
                
                targetDiscs.forEach(d => {
                  if (d.comments && d.comments.nodes) {
                    globalGalleryComments = globalGalleryComments.concat(d.comments.nodes);
                  }
                });
                console.log(`[ШАГ 1] Суммарно загружено комментов для анализа из совпавших категорий: ${globalGalleryComments.length}`);
              } catch (err) {
                console.log("[ШАГ 1] ❌ Ошибка глобального сбора поделок:", err.message);
              }
            }

            // Объект для хранения идеально подготовленных YAML строк по каждой группе
            let yamlGroupUpdates = {};

            // === ШАГ 2: ПОСЛЕДОВАТЕЛЬНАЯ ГЕНЕРАЦИЯ СВОДНОГО ОТЧЕТА ТАБЛИЦЫ ===
            for (const time of scheduleGroups) {
              console.log(`\n--- Обработка группы ${time} ---`);
              markdownBody += showProjects ? `| **⏰ ГРУППА ${time}** | | | |\n` : `| **⏰ ГРУППА ${time}** | | |\n`;
              
              const groupData = tempJournal[time] || { present_permanent: [], newbies: [], probation: [] };
              const permanentKids = studentsData[targetDay][time] || [];

              let blockPermanent = [];
              let blockNewbies = [];
              let blockProbation = [];
              let currentGroupYamlRows = [];

              // Внутренняя изолированная функция разбора и чистки строк (ЭТАЛОННЫЙ ЧИСТЫЙ КОНВЕЙЕР)
              async function processKidRow(rawName, statusText, isNewbie = false) {
                console.log(`\n=== [РАДАР YAML БАЗЫ] ===`);
                console.log(`Функция получила rawName: '${rawName}' (Длина: ${rawName.length})`);
                console.log(`Посимвольный код rawName: ${rawName.split('').map(c => c.charCodeAt(0)).join(' ')}`);

                // Этаж 1: Первичная инициализация базовых переменных конвейера
                let track = "";
                let projectLink = "";

                // Этаж 2: Первичный поиск готового тега (@ник или #тег) в прилетевшей сырой строке
                let matchReady = rawName.match(/(@[a-zA-Z0-9_\-]+|#[a-zA-Z0-9_\-]+)/i);
                let targetTag = matchReady ? matchReady[0] : "";
                console.log(`Результат поиска готового тега: '${targetTag}'`);

                // Этаж 3: Вычисляем флаг автогенерации (знак # в строке есть, а готового латинского тега нет)
                let needAutoGenerate = !targetTag && rawName.includes("#");

                // Этаж 4: СРАЗУ НА ВХОДЕ убираем только опечатки раскладки [c]/[с] и выжигаем мусорные кавычки с сайта!
                let normalized = rawName.replace(/\[c\]/i, "[с]").replace(/"/g, "").trim();

                // Этаж 5: Вычисляем направление занятия (электроника или столярное)
                if (normalized.toLowerCase().includes("[э]")) track = "электроника";
                else if (normalized.toLowerCase().includes("[с]")) track = "столярное";

                // Этаж 6: АВТОГЕНЕРАЦИЯ ТЕГА: Срабатывает строго для новичков по нашему входному флагу
                if (needAutoGenerate) {
                  let nameForTag = normalized.replace(/\[э\]/i, "").replace(/\[с\]/i, "").replace(/#/g, "").replace(/\s+/g, " ").trim();
                  targetTag = `#techlab-${translitRusToLat(nameForTag)}`;
                  
                  // Хирургически заменяем одиночный символ # прямо на латинский тег!
                  normalized = normalized.replace("#", targetTag).trim();
                  console.log(`[АВТОГЕНЕРАЦИЯ] Одиночный знак # успешно заменен на латинский тег: ${targetTag}`);
                }

                // Этаж 7: ГЛОБАЛЬНЫЙ РАДАР ПО КАТЕГОРИИ ГАЛЕРЕЯ (ИСПРАВЛЕН ИНДЕКС МАССИВА)
                if (showProjects && targetTag) {
                  let matches = globalGalleryComments.filter(c => c.body && c.body.includes(targetTag));
                  if (matches.length > 0) {
                    matches.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    // Ссылка строится по первому, самому свежему комменту из массива
                    projectLink = `[🔍 Поделка](${matches[0].url})`;
                    console.log(`[РАДАР] Робот нашёл поделку для ${normalized} по тегу ${targetTag} -> ${matches[0].url}`);
                  }
                }

                // Этаж 8: ФИНАЛ — Чистое имя вычисляется, когда строка полностью нормализована конвейером
                let printName = normalized.replace(/"/g, "")
                                          .replace(/\[э\]/i, "")
                                          .replace(/\[с\]/i, "")
                                          .replace(/(@[a-zA-Z0-9_\-]+|#[a-zA-Z0-9_\-]+)/g, "")
                                          .replace(/\s+/g, " ")
                                          .trim();

                let directionSuffix = track === "электроника" ? " [э]" : track === "столярное" ? " [с]" : "";
                let tagSuffix = targetTag ? ` ${targetTag}` : "";
                let finalYamlLine = `${printName}${directionSuffix}${tagSuffix}`;

                return {
                  nameForSort: printName,
                  track: track,
                  status: statusText,
                  project: projectLink,
                  yamlLine: finalYamlLine
                };
              }

              // 2.1. Обработка постоянного состава из YAML
              for (const kid of permanentKids) {
                const processed = await processKidRow(kid, "");
                const isPresent = groupData.present_permanent.some(p => p.trim().replace(/["']/g, '').toLowerCase() === processed.nameForSort.toLowerCase());
                processed.status = isPresent ? "🟢 Присутствовал" : "🔴 Отсутствовал";
                blockPermanent.push(processed);
                currentGroupYamlRows.push(processed.yamlLine);
              }

              // 2.2. Обработка новичков с сайта
              if (groupData.newbies && groupData.newbies.length > 0) {
                for (const newbie of groupData.newbies) {
                  const processed = await processKidRow(newbie, "🟡 Новичок", true);
                  blockNewbies.push(processed);
                  currentGroupYamlRows.push(processed.yamlLine);
                }
              }

              // 2.3. Обработка временных пробных детей
              if (groupData.probation && groupData.probation.length > 0) {
                for (const prob of groupData.probation) {
                  blockProbation.push(await processKidRow(prob, "🔵 Пробное"));
                }
              }

              // Сортировка блоков строго по алфавиту от А до Я по чистому имени
              blockPermanent.sort((a, b) => a.nameForSort.localeCompare(b.nameForSort, 'ru'));
              blockNewbies.sort((a, b) => a.nameForSort.localeCompare(b.nameForSort, 'ru'));
              blockProbation.sort((a, b) => a.nameForSort.localeCompare(b.nameForSort, 'ru'));

              // Печать в Markdown отчёт
              const printRows = (block) => {
                block.forEach(row => {
                  markdownBody += showProjects ? `| ${row.nameForSort} | ${row.status} | ${row.track} | ${row.project || " "} |\n` : `| ${row.nameForSort} | ${row.status} | ${row.track} |\n`;
                });
              };
              printRows(blockPermanent);
              printRows(blockNewbies);
              printRows(blockProbation);

              // Алфавитная сортировка всего списка группы для последующей чистой записи в YAML базу Шага 3
              currentGroupYamlRows.sort((a, b) => {
                let cleanA = a.replace(/\[э\]/i, "").replace(/\[с\]/i, "").replace(/(@|#)[a-zA-Z0-9_\-]+/i, "").trim();
                let cleanB = b.replace(/\[э\]/i, "").replace(/\[с\]/i, "").replace(/(@|#)[a-zA-Z0-9_\-]+/i, "").trim();
                return cleanA.localeCompare(cleanB, 'ru');
              });

              yamlGroupUpdates[time] = currentGroupYamlRows;
            }
            
            markdownBody += `\n*Проверил и отправил преподаватель: **${teacherUsername}***\n`;

            // ПУБЛИКАЦИЯ В GitHub Discussions (ДИНАМИЧЕСКИЙ НОМЕР ИЗ YAML НАСТРОЕК УЧИТЕЛЯ)
            console.log(`[ОТПРАВКА] Запрос ID для целевой Дискуссии №${configData.discussion_number}...`);
            const queryGetId = `query {
              repository(owner: "${context.repo.owner}", name: "${context.repo.repo}") {
                discussion(number: ${configData.discussion_number}) { id }
              }
            }`;
            const resId = await github.graphql(queryGetId);
            const discussionId = resId.repository.discussion.id;

            const mutationAddComment = `mutation {
              addDiscussionComment(input: {discussionId: "${discussionId}", body: ${JSON.stringify(markdownBody)}}) {
                comment { id }
              }
            }`;
            await github.graphql(mutationAddComment);
            console.log(`Сводный журнал успешно опубликован в Обсуждении №${configData.discussion_number}!`);
            core.exportVariable('TEACHER_NAME', teacherUsername);

            // === ШАГ 3: ЧИСТАЯ ПЕРЕЗАПИСЬ YAML БАЗЫ ДАННЫХ ИЗ ГОТОВЫХ МАССИВОВ ШАГА 2 ===
            let hasNewbies = false;
            filledTimes.forEach(time => {
              if (tempJournal[time].newbies && tempJournal[time].newbies.length > 0) hasNewbies = true;
            });

            if (hasNewbies || true) { // Запускаем перезапись всегда, чтобы поддерживать алфавитный порядок всей базы дня!
              console.log("=== ОБНОВЛЕНИЕ И СОРТИРОВКА БАЗЫ YAML ===");
              let newLines = [];
              let insideDay = false;

              for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trimEnd();
                const indent = line.search(/\S/);

                if (indent === 0 && trimmed.endsWith(':')) {
                  insideDay = (trimmed.slice(0, -1).toLowerCase().trim() === targetDay);
                  newLines.push(line);
                  continue;
                }

                if (insideDay && indent === 2 && trimmed.includes(':')) {
                  const groupTimeClean = trimmed.trim().slice(0, -1).replace(/"/g, '').replace(/'/g, '').trim();
                  newLines.push(line);

                  // Берем уже идеально собранный и отсортированный по алфавиту список строк из Шага 2!
                  let finalRowsToSave = yamlGroupUpdates[groupTimeClean] || studentsData[targetDay][groupTimeClean] || [];

                  finalRowsToSave.forEach(kidLine => {
                    let cleanLine = kidLine.replace(/"/g, '').trim();
                    newLines.push(`    - "${cleanLine}"`);
                  });

                  // Пропускаем старый список детей из файла, так как мы полностью заменили его на новый эталонный
                  while (i + 1 < lines.length) {
                    const nextLine = lines[i + 1];
                    const nextIndent = nextLine.search(/\S/);
                    if (nextIndent === 4 && nextLine.trim().startsWith('-')) {
                      i++;
                    } else {
                      break;
                    }
                  }
                  continue;
                }
                newLines.push(line);
              }
              fs.writeFileSync(yamlPath, newLines.join('\n'), 'utf8');
              console.log("Файл YAML расписания успешно отсортирован по алфавиту и обновлен без дубликатов!");
            }

            // Зачистка: Удаляем временные файлы групп строго после сборки дня
            todaysFiles.forEach(file => {
              fs.unlinkSync(path.join(dataDir, file));
            });

      # 7. БАШ-СКРИПТ ДЛЯ УЗНАВАНИЯ ИМЕНИ, УДАЛЕНИЯ МУСОРА И КОММИТА
      - name: Commit Base Updates and Purge Temp Files
        run: |
          # Используем имя преподавателя, которое передаётся через настройки Git-окружения
          TEACHER_NAME="${{ env.TEACHER_NAME }}"
          if [ -z "$TEACHER_NAME" ]; then
            TEACHER_NAME="TechLab"
          fi
          
          echo "Автор коммита: $TEACHER_NAME"
          
          git config --global user.name "$TEACHER_NAME"
          git config --global user.email "actions@github.com"
          
          # Фиксируем удаление временных файлов групп в репозитории
          git add _data/*-journal-attendance-*.json
          git add _data/journal-attendance-*.yml
          
          git commit -m "Сводный журнал за день от $TEACHER_NAME [skip ci]" && git push || echo "Нет изменений для авто-коммита базы"
          
