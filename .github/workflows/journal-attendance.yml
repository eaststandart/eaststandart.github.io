name: Generate Attendance Report to Discussions 

on:
  push:
    paths:
      - '_data/*-journal-attendance-*.json'

permissions:
  contents: write
  discussions: write

jobs:
  build_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pyyaml requests

      - name: Run Python Report Generator
        run: python _actions/journalattendance.py
        env:
          MY_ADMIN_TOKEN: ${{ secrets.MY_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # === ФИНАЛЬНЫЙ ШАГ: АВТО-КОММИТ И ФИКСАЦИЯ ИЗМЕНЕНИЙ БАЗЫ YAML НА GITHUB ===
      - name: Commit Base Updates and Purge Temp Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          
          # ИСПРАВЛЕНО: Возвращена твоя оригинальная хирургическая маска отслеживания файлов!
          git add _data/*-journal-attendance-*.json || true
          git add _data/journal-attendance-*.yml || true
          
          # Делаем пуш изменений с флагом [skip ci], чтобы робот не зацикливался сам на себя!
          git commit -m "Сводный журнал за день от Робота [skip ci]" && git push || echo "Нет изменений для авто-коммита базы"
