name: Generate Attendance Report to Discussions

on:
  push:
    paths:
      - '_attendance/**.json'

permissions:
  contents: write
  discussions: write

jobs:
  build_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Report Generator and Database Updater
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const dirPath = path.join(process.env.GITHUB_WORKSPACE, '_attendance');
            if (!fs.existsSync(dirPath)) {
              console.log("Папка _attendance не найдена.");
              return;
            }

            const files = fs.readdirSync(dirPath).filter(f => f.endsWith('.json'));
            if (files.length === 0) {
              console.log("JSON файлы отчетов не найдены.");
              return;
            }

            files.sort();
            const latestFile = files[files.length - 1];
            const rawData = fs.readFileSync(path.join(dirPath, latestFile), 'utf8');
            const report = JSON.parse(rawData);

            const yamlPath = path.join(process.env.GITHUB_WORKSPACE, '_data', 'journal-students.yml');
            if (!fs.existsSync(yamlPath)) {
              console.log("Файл базы данных детей не найден.");
              return;
            }

            let yamlText = fs.readFileSync(yamlPath, 'utf8');
            
            let studentsData = {};
            let currentDay = "";
            let currentGroup = "";
            const lines = yamlText.split('\n');
            
            lines.forEach(line => {
              const trimmed = line.trimEnd();
              if (!trimmed || trimmed.startsWith('#')) return;
              const indent = line.search(/\S/);
              if (indent === 0 && trimmed.endsWith(':')) {
                currentDay = trimmed.slice(0, -1).toLowerCase().trim();
                studentsData[currentDay] = {};
              } else if (indent === 2 && trimmed.includes(':')) {
                // Исправлено: сначала берем строку из сплита, затем очищаем от кавычек
                currentGroup = trimmed.split(':')[0].replace(/['"]/g, '').trim();
                studentsData[currentDay][currentGroup] = [];
              } else if (indent === 4 && trimmed.startsWith('-')) {
                const name = trimmed.substring(trimmed.indexOf('-') + 1).trim();
                if (currentDay && currentGroup) studentsData[currentDay][currentGroup].push(name);
              }
            });

            // Форматируем дату красиво
            const rawDate = Array.isArray(report.date) ? report.date[0] : report.date;
            const dateParts = rawDate.split('-');
            const formattedDate = `${dateParts[2]}.${dateParts[1]}.${dateParts[0]} г.`;

            let markdownBody = `### 📅 Журнал посещений за ${formattedDate}\n\n`;
            markdownBody += `| Группа / Ученик | Статус |\n`;
            markdownBody += `| :--- | :---: |\n`;
            markdownBody += `| **⏰ ГРУППА ${report.time}** | |\n`;

            const targetDay = report.day.toLowerCase().trim();
            const permanentKids = (studentsData[targetDay] && studentsData[targetDay][report.time]) ? studentsData[targetDay][report.time] : [];

            permanentKids.forEach(kid => {
              if (report.present_permanent.includes(kid)) {
                markdownBody += `| ${kid} | 🟢 Присутствовал |\n`;
              }
            });
            if (report.newbies && report.newbies.length > 0) {
              report.newbies.forEach(newbie => {
                const suffix = report.is_newbies_probation ? " (Пробное)" : " (Новичок)";
                markdownBody += `| ${newbie} | 🟢 Присутствовал${suffix} |\n`;
              });
            }

            permanentKids.forEach(kid => {
              if (!report.present_permanent.includes(kid)) {
                markdownBody += `| ${kid} | 🔴 Не присутствовал |\n`;
              }
            });

            // Получаем внутренний ID темы обсуждения №38
            const queryGetId = `query {
              repository(owner: "${context.repo.owner}", name: "${context.repo.repo}") {
                discussion(number: 38) { id }
              }
            }`;
            
            const resId = await github.graphql(queryGetId);
            const discussionId = resId.repository.discussion.id;

            // Публикуем созданную таблицу в Дискуссии
            const mutationAddComment = `mutation {
              addDiscussionComment(input: {discussionId: "${discussionId}", body: ${JSON.stringify(markdownBody)}}) {
                comment { id }
              }
            }`;
            await github.graphql(mutationAddComment);
            console.log("Журнал успешно опубликован в Обсуждении #38!");

            // Если добавлены новые постоянные ученики, автоматически вписываем их в YAML базу
            if (report.newbies && report.newbies.length > 0 && !report.is_newbies_probation) {
              console.log("Обнаружены постоянные новички. Обновляем базу данных...");
              
              let newLines = [];
              let insideTargetDay = false;
              let insideTargetGroup = false;
              let added = false;

              for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trimEnd();
                const indent = line.search(/\S/);

                if (indent === 0 && trimmed.endsWith(':')) {
                  const dayName = trimmed.slice(0, -1).toLowerCase().trim();
                  insideTargetDay = (dayName === targetDay);
                }

                if (insideTargetDay && indent === 2 && trimmed.includes(':')) {
                  // Исправлено: корректное извлечение имени группы без ошибок replace
                  const groupTime = trimmed.split(':')[0].replace(/['"]/g, '').trim();
                  insideTargetGroup = (groupTime === report.time);
                }

                newLines.push(line);

                if (insideTargetDay && insideTargetGroup) {
                  const nextLine = lines[i + 1];
                  const nextIndent = nextLine ? nextLine.search(/\S/) : -1;
                  
                  if (!nextLine || nextIndent === 0 || nextIndent === 2 || nextLine.trim() === "") {
                    if (!added) {
                      report.newbies.forEach(newbie => {
                        if (!permanentKids.includes(newbie)) {
                          newLines.push(`    - ${newbie}`);
                        }
                      });
                      added = true;
                      insideTargetGroup = false;
                    }
                  }
                }
              }

              fs.writeFileSync(yamlPath, newLines.join('\n'), 'utf8');
            }

      - name: Commit Database Updates
        run: |
          git config --global user.name "GitHub Academic Robot"
          git config --global user.email "actions@github.com"
          git add _data/journal-students.yml
          git diff --quiet && git diff --cached --quiet || (git commit -m "Авто-добавление новых учеников по итогам занятия" && git push)
