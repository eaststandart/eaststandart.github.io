name: Generate Attendance Report to Discussions

on:
  push:
    paths:
      - '_data/temp-journal.json'

permissions:
  contents: write
  discussions: write

jobs:
  build_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Report Generator and Database Updater
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 1. Читаем временный файл дня, присланный с сайта
            const tempPath = path.join(process.env.GITHUB_WORKSPACE, '_data', 'temp-journal.json');
            if (!fs.existsSync(tempPath)) {
              console.log("Временный файл отчета temp-journal.json не найден.");
              return;
            }

            const rawTempData = fs.readFileSync(tempPath, 'utf8');
            let tempJournal = {};
            try {
              tempJournal = JSON.parse(rawTempData);
            } catch (e) {
              console.log("Ошибка чтения JSON из temp-journal.json");
              return;
            }

            // Достаем метаданные дня из первой попавшейся заполненной группы
            const filledTimes = Object.keys(tempJournal);
            if (filledTimes.length === 0) {
              console.log("Временный журнал пуст.");
              return;
            }
            const firstReport = tempJournal[filledTimes[0]];
            const targetDay = firstReport.day.toLowerCase().trim();
            const dateStr = firstReport.date;
            const teacherUsername = firstReport.teacher_username || "Преподаватель";

            // 2. Читаем официальную YAML базу детей, чтобы узнать расписание групп
            const yamlPath = path.join(process.env.GITHUB_WORKSPACE, '_data', 'journal-students.yml');
            if (!fs.existsSync(yamlPath)) {
              console.log("Файл базы данных детей не найден.");
              return;
            }

            let yamlText = fs.readFileSync(yamlPath, 'utf8');
            let studentsData = {};
            let currentDay = "";
            let currentGroup = "";
            const lines = yamlText.split('\n');
            
            lines.forEach(line => {
              const trimmed = line.trimEnd();
              if (!trimmed || trimmed.startsWith('#')) return;
              
              const indent = line.search(/\S/);
              const cleanText = trimmed.trim();

              if (indent === 0 && cleanText.endsWith(':')) {
                currentDay = cleanText.slice(0, -1).toLowerCase().trim();
                studentsData[currentDay] = {};
              } 
              else if (indent === 2 && cleanText.endsWith(':')) {
                // Полностью очищаем имя группы от любых кавычек и двоеточий
                currentGroup = cleanText.slice(0, -1).replace(/['"]/g, '').trim();
                studentsData[currentDay][currentGroup] = [];
              } 
              else if (indent === 4 && cleanText.startsWith('-')) {
                const name = cleanText.substring(cleanText.indexOf('-') + 1).trim();
                if (currentDay && currentGroup && studentsData[currentDay][currentGroup]) {
                  studentsData[currentDay][currentGroup].push(name);
                }
              }
            });

            // Узнаем, сколько всего групп запланировано в расписании на этот день недели
            const scheduleGroups = studentsData[targetDay] ? Object.keys(studentsData[targetDay]) : [];
            console.log(`Запланировано групп на ${targetDay}: ${scheduleGroups.length}. Отправлено учителем: ${filledTimes.length}`);
            // 3. ПРОВЕРКА КОМПЛЕКТНОСТИ ДНЯ
            // Если учитель заполнил ещё не все группы из расписания, останавливаемся
            if (filledTimes.length < scheduleGroups.length) {
              console.log("День ещё не завершён. Ждём отправки остальных групп. Завершаем текущий шаг.");
              return;
            }

            console.log("Все группы за день успешно собраны! Генерируем финальный отчёт...");

            // 4. СБОРКА ЕДИНОЙ ТАБЛИЦЫ ДЛЯ ДИСКУССИЙ
            const dateParts = dateStr.split('-');
            const formattedDate = `${dateParts[2]}.${dateParts[1]}.${dateParts[0]} г.`;

            let markdownBody = `### 📅 Единый журнал посещений за ${formattedDate} (${firstReport.day})\n\n`;
            markdownBody += `*Проверил и отправил преподаватель: **${teacherUsername}***\n\n`;
            markdownBody += `| Группа / Ученик | Статус |\n`;
            markdownBody += `| :--- | :---: |\n`;

            // Бежим по каждой группе текущего дня из расписания
            scheduleGroups.sort().forEach(time => {
              markdownBody += `| **⏰ ГРУППА ${time}** | |\n`;
              const groupData = tempJournal[time] || { present_permanent: [], newbies: [], probation: [] };
              const permanentKids = studentsData[targetDay][time] || [];

              // Отмечаем присутствующих постоянных детей
              permanentKids.forEach(kid => {
                // Очищаем имя из базы и ищем его совпадение в присланном массиве с сайта
                const isPresent = groupData.present_permanent.some(p => p.trim().toLowerCase() === kid.trim().toLowerCase());
                
                if (isPresent) {
                  markdownBody += `| ${kid} | 🟢 Присутствовал |\n`;
                }
              });

              // Добавляем новых постоянных новичков
              if (groupData.newbies && groupData.newbies.length > 0) {
                groupData.newbies.forEach(newbie => {
                  markdownBody += `| ${newbie} | 🟢 Присутствовал (Новичок) |\n`;
                });
              }

              // Добавляем временных пробных детей
              if (groupData.probation && groupData.probation.length > 0) {
                groupData.probation.forEach(prob => {
                  markdownBody += `| ${prob} | 🔵 Присутствовал (Пробное) |\n`;
                });
              }

              // Отмечаем отсутствующих постоянных детей
              permanentKids.forEach(kid => {
                const isPresent = groupData.present_permanent.some(p => p.trim().toLowerCase() === kid.trim().toLowerCase());
                
                if (!isPresent) {
                  markdownBody += `| ${kid} | 🔴 Не присутствовал |\n`;
                }
              });

            // 5. ОТПРАВКА КОММЕНТАРИЯ В GitHub Discussions №38
            const queryGetId = `query {
              repository(owner: "${context.repo.owner}", name: "${context.repo.repo}") {
                discussion(number: 38) { id }
              }
            }`;
            const resId = await github.graphql(queryGetId);
            const discussionId = resId.repository.discussion.id;

            const mutationAddComment = `mutation {
              addDiscussionComment(input: {discussionId: "${discussionId}", body: ${JSON.stringify(markdownBody)}}) {
                comment { id }
              }
            }`;
            await github.graphql(mutationAddComment);
            console.log("Сводный журнал успешно опубликован в Обсуждении #38!");

            // 6. ОБНОВЛЕНИЕ YAML БАЗЫ ДЕТЕЙ (ТОЛЬКО ПОСТОЯННЫЕ НОВИЧКИ)
            let hasNewbies = false;
            filledTimes.forEach(time => {
              if (tempJournal[time].newbies && tempJournal[time].newbies.length > 0) hasNewbies = true;
            });

            if (hasNewbies) {
              console.log("Обнаружены постоянные новички. Записываем их в базу...");
              let newLines = [];
              let insideDay = false;
              let insideGroup = false;

              for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const trimmed = line.trimEnd();
                const indent = line.search(/\S/);

                if (indent === 0 && trimmed.endsWith(':')) {
                  insideDay = (trimmed.slice(0, -1).toLowerCase().trim() === targetDay);
                }
                if (insideDay && indent === 2 && trimmed.includes(':')) {
                  const groupTime = trimmed.split(':').slice(0, 2).join(':').replace(/['"]/g, '').trim();
                  insideGroup = tempJournal[groupTime] && tempJournal[groupTime].newbies && tempJournal[groupTime].newbies.length > 0;
                  
                  newLines.push(line);
                  if (insideGroup) {
                    const groupTimeClean = trimmed.split(':')[0].replace(/['"]/g, '').trim();
                    const currentPermanent = studentsData[targetDay][groupTimeClean] || [];
                    tempJournal[groupTimeClean].newbies.forEach(newbie => {
                      if (!currentPermanent.includes(newbie)) {
                        newLines.push(`    - ${newbie}`);
                      }
                    });
                  }
                  continue;
                }
                newLines.push(line);
              }
              fs.writeFileSync(yamlPath, newLines.join('\n'), 'utf8');
            }

            // 7. ЗАЧИСТКА: Удаляем временный файл temp-journal.json с диска виртуальной машины
            fs.unlinkSync(tempPath);
            console.log("Временный файл удален локально.");

      # 8. ФИНАЛЬНЫЙ КОММИТ ОТ ИМЕНИ ПРЕПОДАВАТЕЛЯ И ЗАЧИСТКА В РЕПОЗИТОРИИ
      - name: Push Base Updates and Delete Temp File from Repo
        run: |
          # Вытягиваем логин учителя через стандартную переменную окружения node
          echo "const fs = require('fs'); try { const data = JSON.parse(fs.readFileSync('_data/temp-journal.json', 'utf8')); const firstKey = Object.keys(data)[0]; console.log(data[firstKey].teacher_username); } catch(e) { console.log('GitHub Academic Robot'); }" > get_name.js
          TEACHER_NAME=$(node get_name.js)
          rm -f get_name.js
          
          git config --global user.name "$TEACHER_NAME"
          git config --global user.email "actions@github.com"
          
          # Удаляем временный файл из репозитория, чтобы не захламлять историю
          git rm -f _data/temp-journal.json || true
          git add _data/journal-students.yml
          
          git commit -m "Сводный журнал посещаемости за день от $TEACHER_NAME [skip ci]" && git push || echo "Нет изменений для коммита"
