name: Review Faire video frames

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/review-faire-video.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Extract contact sheet
        run: |
          mkdir -p review-output
          ffmpeg -hide_banner -loglevel error \
            -i "faire/robot-strannik/robot-strannik-01.webm" \
            -vf "fps=1/3,scale=480:-1,tile=4x3:padding=12:margin=12:color=white" \
            -frames:v 1 review-output/robot-strannik-01.jpg
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "faire/robot-strannik/robot-strannik-01.webm" \
            > review-output/duration-seconds.txt

      - name: Upload contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: faire-video-review
          path: review-output/
          if-no-files-found: error
          retention-days: 2
