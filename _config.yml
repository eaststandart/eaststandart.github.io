# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

url: https://eaststandart.github.io

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
 
collections:
  people:
    output: true
    permalink: "/people/:title/"

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Markdown and syntax highlight
markdown: kramdown
kramdown:
  math_engine: mathjax
  math_engine_opts: # more info: https://kramdown.gettalong.org/math_engine/mathjax.html
    preview: false
    preview_as_code: false

# Includes & excludes
include: ["_pages"]
exclude:
  - LICENSE
  - README.md
