# =============================================================================
# Collections
# =============================================================================

collections:
  people:
    output: true
    permalink: "/people/:title/"
  engineers:
    output: true
    permalink: "/engineers/:title/"
  process:
    output: true
    permalink: "/process/:title/"

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

# Includes & excludes

include: ["_pages", "robots.txt"]
exclude:
  - ARCHITECTURE.md
  - CHANGELOG.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - LICENSE.txt
  - README.md
  - ROADMAP.md

# Plug-ins
plugins:
  - jekyll-sitemap
  - jekyll-email-protect
  - jekyll-minifier

# Sitemap settings
defaults:
  - scope:
      path: ""
    values:
      image:
        path: "/assets/icons/logo.svg"
        alt: "Радиотехника: техническое творчество учащихся" 
