{%- comment -%}
@about Подключение математического движка MathJax v3.
@purpose Для корректного отображения формул из Obsidian через знаки $ и $$. Подключается только на страницах со свойством mathjax: true.
@author TechLab
{%- endcomment -%}

<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
