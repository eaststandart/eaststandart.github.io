<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">

<defs>

<!-- Основной фон: переход от глубокого лесного зеленого к темно-бордовому -->
<linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320">
    <stop offset="0%" stop-color="#0a2f1d"/>
    <stop offset="40%" stop-color="#114228"/>
    <stop offset="75%" stop-color="#4a121a"/>
    <stop offset="100%" stop-color="#2b070c"/>
</linearGradient>

<!-- Свечение слева: Ярко-зеленый (Электроника) -->
<radialGradient id="glowGreen">
    <stop offset="0%" stop-color="#39ff14" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
</radialGradient>

<!-- Свечение справа: Импульсный Красный (Робототехника/Лазеры) -->
<radialGradient id="glowRed">
    <stop offset="0%" stop-color="#ff3333" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#ff3333" stop-opacity="0"/>
</radialGradient>

<filter id="blur80">
    <feGaussianBlur stdDeviation="80"/>
</filter>

<filter id="blur50">
    <feGaussianBlur stdDeviation="50"/>
</filter>

</defs>

<!-- Задний фон баннера -->
<rect width="1280" height="320" rx="16" fill="url(#bg)"/>

<!-- Световые неоновые пятна -->
<g filter="url(#blur80)">
    <circle cx="120" cy="60" r="220" fill="url(#glowGreen)"/>
</g>

<g filter="url(#blur80)">
    <circle cx="1120" cy="260" r="240" fill="url(#glowRed)"/>
</g>

<!-- Подсветка центральных областей -->
<g filter="url(#blur50)">
    <ellipse cx="450" cy="100" rx="260" ry="70"
             fill="#39ff14"
             fill-opacity="0.08"/>
</g>

<g filter="url(#blur50)">
    <ellipse cx="850" cy="220" rx="320" ry="80"
             fill="#ff3333"
             fill-opacity="0.06"/>
</g>

<!-- Нижние волны (сделаны полупрозрачными белыми, они мягко переливаются на зелено-красном фоне) -->
<path
d="M0 220
C150 180 260 260 420 220
C580 180 700 260 860 220
C1020 180 1140 250 1280 210
L1280 320
L0 320
Z"
fill="#ffffff"
fill-opacity="0.03"/>

<path
d="M0 250
C180 220 320 290 500 250
C680 210 820 290 1000 250
C1120 225 1200 260 1280 240
L1280 320
L0 320
Z"
fill="#ffffff"
fill-opacity="0.02"/>

<!-- Белое лого (Инженерный щит / Компонент) -->
<g transform="translate(70 50) scale(0.55)">
<path
fill="#ffffff"
fill-opacity="0.95"
