<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://w3.org">

<defs>

<!-- Основной фон: очень мягкий, чистый светло-серый/белый как на GitHub -->
<linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320">
    <stop offset="0%" stop-color="#f6f8fa"/>
    <stop offset="100%" stop-color="#ffffff"/>
</linearGradient>

<!-- Легкое пастельное зеленое облако слева (Мята) -->
<radialGradient id="lightGreen">
    <stop offset="0%" stop-color="#dafbe1" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#dafbe1" stop-opacity="0"/>
</radialGradient>

<!-- Легкое пастельное красное облако справа (Коралл) -->
<radialGradient id="lightRed">
    <stop offset="0%" stop-color="#ffebe9" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#ffebe9" stop-opacity="0"/>
</radialGradient>

<filter id="blur80">
    <feGaussianBlur stdDeviation="70"/>
</filter>

</defs>

<!-- Основа баннера с легкой серой рамкой, как у карточек GitHub -->
<rect width="1280" height="320" rx="12" fill="url(#bg)" stroke="#d0d7de" stroke-width="1"/>

<!-- Нежные размытые цветовые пятна по углам (зеленый и красный) -->
<g filter="url(#blur80)">
    <circle cx="150" cy="80" r="260" fill="url(#lightGreen)"/>
    <circle cx="1130" cy="240" r="280" fill="url(#lightRed)"/>
</g>

<!-- Мягкие, едва заметные волны внизу для глубины -->
<path
d="M0 230
C200 200 300 270 500 230
C700 190 850 270 1050 230
C1150 210 1220 240 1280 220
L1280 320
L0 320
Z"
fill="#ffffff"
fill-opacity="0.6"/>

