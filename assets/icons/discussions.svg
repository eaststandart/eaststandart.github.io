<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://w3.org">

<defs>

<!-- Идеально чистый, белый фон всей карточки -->
<linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#ffffff"/>
</linearGradient>

<!-- Чистый мятно-зеленый (взят из палитры успешных тестов GitHub) -->
<radialGradient id="cleanGreen" cx="20%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#dafbe1" stop-opacity="0.9"/>
    <stop offset="50%" stop-color="#dafbe1" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>

<!-- Чистый нежный кораллово-красный (взят из палитры алертов GitHub) -->
<radialGradient id="cleanRed" cx="85%" cy="70%" r="60%">
    <stop offset="0%" stop-color="#ffebe9" stop-opacity="0.95"/>
    <stop offset="50%" stop-color="#ffebe9" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</radialGradient>

<!-- Сильное размытие для создания эффекта воздушного градиентного тумана -->
<filter id="superBlur">
    <feGaussianBlur stdDeviation="90"/>
</filter>

</defs>

<!-- Основа баннера с аккуратным тонким серым контуром карточек GitHub -->
<rect width="1280" height="320" rx="12" fill="url(#bg)" stroke="#d0d7de" stroke-width="1"/>

<!-- Наложение абсолютно чистых цветных облаков (никакой грязи и бурых пятен) -->
<rect width="1280" height="320" fill="url(#cleanGreen)" filter="url(#superBlur)"/>
<rect width="1280" height="320" fill="url(#cleanRed)" filter="url(#superBlur)"/>

<!-- Иконка-логотип (фирменный темно-серый цвет текста GitHub) -->
<g transform="translate(70 50) scale(0.55)">
<path
fill="#24292f"
d="M 199.99812,0.9250081 C 89.709169,0.9250081 0.9250081,89.709169 0.9250081,199.99812 c 0,110.28895 88.7841609,199.07828 199.0731119,199.07828 110.28895,0 199.07828,-88.78933 199.07828,-199.07828 0,-110.288951 -88.78933,-199.0731119 -199.07828,-199.0731119 z m -43.3772,34.2149649 h 84.24809 a 46.328021,45.741958 0 0 1 46.32792,45.743976 v 68.021681 h 36.3647 a 5.6168988,6.1578385 0 0 1 5.61206,6.15467 v 36.94348 a 5.6168988,6.1578385 0 0 1 -5.61206,6.15983 H 284.055 v 151.11738 a 17.398092,15.718327 0 0 1 -17.39945,15.71997 17.398092,15.718327 0 0 1 -17.39946,-15.71997 V 198.16361 h -32.81453 v 151.11738 a 17.398092,15.718327 0 0 1 -17.39429,15.71997 17.398092,15.718327 0 0 1 -17.40462,-15.71997 V 198.16361 h -32.77836 v 151.11738 a 17.398092,15.718327 0 0 1 -17.40462,15.71997 17.398092,15.718327 0 0 1 -17.39945,-15.71997 V 198.16361 H 76.439776 a 5.6168988,6.1578385 0 0 1 -5.617228,-6.15983 V 155.0603 a 5.6168988,6.1578385 0 0 1 5.617228,-6.15467 H 110.2775 V 80.894284 a 46.338914,45.752713 0 0 1 46.34342,-45.754311 z"/>
</g>

